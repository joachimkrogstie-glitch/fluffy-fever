<script>
(() => {
'use strict';

// ---------- Oppsett ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

addEventListener('resize', resize);
resize();

const FONT = '"Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif';
const TITLE_FONT = '"Sniglet", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif';

// Dusty pastel palette for all text and interface elements
const UI = {
  ink: '#6c5b7b',       // main text
  inkSoft: '#8d7e9c',   // secondary text
  rose: '#c48a9f',      // highlights, call to action
  roseDeep: '#a26f86',  // score
  lav: '#9b8dbb',
  sky: '#8ea8c3',
  sage: '#93b2a0',
  peach: '#d29c86',
  butter: '#d8bd84',
  panel: 'rgba(251,246,243,0.9)',

// ---------- Fysikk-konstanter (verdensenheter = piksler ved zoom 1, y oppover) ----------

const MIN_SPEED = 240;
const MAX_SPEED = 2000;
const maxSpeed = () => mode === 'high' ? clamp(2000 + Math.max(0, p.x) / 14, 2000, 10000) : clamp(TUNE.spd[0] + Math.max(0, p.x) * TUNE.spd[1], TUNE.spd[0], TUNE.spd[2]);
const POM_R = 26;
const GAME_POM_S = 0.86;   // størrelsen på den nye Pom i forhold til POM_R

// ---------- Hjelpere ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  const a = hexToRgb(c1), b = hexToRgb(c2);

// Sukkerspinn-palett: [hovedfarge, lys topp, dyp bunn]
const CANDY = [

  ['#cbb8ff', '#ece4ff', '#a993f0'], // lavendel
  ['#a6e3ff', '#dcf4ff', '#7fc8ef'], // blåbær-is
  ['#b4f0cf', '#e2fbee', '#86d8ad'], // mynte
  ['#ffd0a6', '#fff0de', '#f5ae78'], // fersken
  ['#fff1a1', '#fffbe0', '#f2d86a'], // sitron

// ---------- Lagring (innstillinger, godteri-lommebok, accessories) ----------
const SAVE_KEY = 'fluffy-fever-2-save';

  const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');

    save.sound = d.sound !== false;
    save.music = d.music !== false;
    save.wallet = Math.max(0, d.wallet | 0);
    save.owned = Array.isArray(d.owned) ? d.owned.filter(x => typeof x === 'string') : [];
    save.look = { ...DEFAULT_LOOK, ...(d.look || {}) };
    save.unlocked = Math.max(1, d.unlocked | 0);
    save.levelBest = (d.levelBest && typeof d.levelBest === 'object') ? d.levelBest : {};
    save.levelStars = (d.levelStars && typeof d.levelStars === 'object') ? d.levelStars : {};
    save.vibrate = d.vibrate !== false; save.shake = d.shake !== false; save.assist = d.assist !== false;
    save.lefty = !!d.lefty; save.calm = !!d.calm; if (typeof d.musicVol === 'number') save.musicVol = d.musicVol; if (typeof d.sfxVol === 'number') save.sfxVol = d.sfxVol;
    save.playLimit = d.playLimit | 0; save.playUsed = +d.playUsed || 0; save.playDay = d.playDay || '';
    save.sunsetBest = Math.max(0, d.sunsetBest | 0);
    save.highBest = Math.max(0, d.highBest | 0);
    save.highDist = Math.max(0, +d.highDist || 0);
    save.treasures = (d.treasures && typeof d.treasures === 'object') ? d.treasures : {};
    save.collected = (d.collected && typeof d.collected === 'object') ? d.collected : {};
    if (d.studio && typeof d.studio === 'object') save.studio = d.studio;
    if (d.pet && typeof d.pet === 'object') save.pet = d.pet;
  }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- Lyd (WebAudio, startes ved første berøring) ----------
let ac = null, muted = !save.sound;
function setSound(on) { save.sound = on; muted = !on; persist(); if (on) { initAudio(); beep(880, 0.1, 'triangle', 0.06); } }

  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  if (ac) musicSetup();
}
let silentEl = null;
function unlockAudio() {
  initAudio();
  if (ac && ac.state !== 'running') ac.resume().catch(() => {});
  // iOS: en stille, loopende <audio> gjør at Web Audio spilles selv med lydløs-bryteren på
  try {
    if (!silentEl) {
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));

      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      b.fill(128, 44);
      let bin = ''; b.forEach(x => bin += String.fromCharCode(x));
      silentEl = document.createElement('audio');
      silentEl.setAttribute('playsinline', ''); silentEl.loop = true; silentEl.src = 'data:audio/wav;base64,' + btoa(bin);
    }
    if (silentEl.paused) silentEl.play().catch(() => {});
  } catch (e) {}
}
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, { passive: true }));
function beep(f, d, type = 'sine', v = 0.07, slideTo = 0, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + d);
  o.connect(g).connect(sfxOut()); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  perfect: (c) => { const b = 520 * Math.pow(1.122, Math.min(c, 8)); beep(b, 0.12, 'triangle', 0.08); beep(b * 1.5, 0.16, 'triangle', 0.06, 0, 0.07); },
  bad: () => beep(180, 0.18, 'sawtooth', 0.04, 90),
  candy: () => beep(1180 + Math.random() * 200, 0.08, 'sine', 0.05),
  launch: () => beep(330, 0.22, 'sine', 0.035, 700),
  island: () => { [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.18, 'triangle', 0.07, 0, i * 0.09)); },
  fever: () => { [784, 988, 1175, 1568].forEach((f, i) => beep(f, 0.12, 'square', 0.035, 0, i * 0.05)); },
  yawn: () => beep(420, 0.9, 'sine', 0.06, 160),
  snack: () => { beep(660, 0.1, 'triangle', 0.07); beep(990, 0.14, 'triangle', 0.06, 0, 0.08); },
  click: () => beep(700, 0.05, 'triangle', 0.05),
  beam: () => { beep(420, 0.35, 'sine', 0.05, 1300); beep(630, 0.3, 'triangle', 0.03, 1600, 0.05); },
  power: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => beep(f, 0.14, 'square', 0.035, 0, i * 0.06)); },
  pop: () => { beep(140 + Math.random() * 80, 0.25, 'triangle', 0.04, 60); beep(900 + Math.random() * 600, 0.12, 'sine', 0.015, 0, 0.05); },
  tick: () => beep(1046 + Math.random() * 400, 0.06, 'triangle', 0.025),
  buy: () => { [660, 880, 1320].forEach((f, i) => beep(f, 0.12, 'triangle', 0.06, 0, i * 0.07)); },
};

// ---------- Rekord ----------
let best = 0;
try { best = parseInt(localStorage.getItem('sukkerpom-best') || '0', 10) || 0; } catch (e) {}
function saveBest() { if (mode === 'levels') save.levelBest[level] = Math.max(save.levelBest[level] || 0, best); else if (mode === 'high') save.highBest = Math.max(save.highBest, best); else save.sunsetBest = Math.max(save.sunsetBest, best); persist(); }

// ---------- Terreng ----------
// Bakkene er en kjede av punkter (annenhver dal / topp) bundet sammen med cosinus-kurver,
// så overflaten er glatt og har analytisk stigning. Hvert punkt husker sitt tema (t).
// Bakkeform: bredde og høyde (justert etter tester med en «erfaren» testspiller)
const TUNE = {
  // Mellomstore bakker med mye variasjon (testspiller med menneskelig reaksjonstid: 11–25 % i motbakke,
  // mot 23–50 % med de smale bakkene og 0–5 % med de svært brede, men ensformige).
  sunsetW: [500, 620], sunsetA: [310, 400],
  levelW: [490, 10, 610, 14], levelA: [300, 6, 390, 10],     // [min, +per nivå, maks, +per nivå]
  // bakketyper: [sjanse, breddefaktor, høydefaktor]; 'roll' = rekke med små kuler
  shapes: [[0.12, 0.62, 0.45], [0.4, 1, 1], [0.22, 0.95, 1.35], [0.18, 1.4, 1.3], [0.08, 'roll']],
  rollShape: [0.62, 0.45],
  dive: 1.2,                                                    // ekstra tyngde når man holder i lufta
  // bakkene foran tilpasser seg Poms fart og høyde: [referansefart, eksponent bredde, eksponent høyde]
  adapt: [1100, 0.5, 0.6],
  assist: 1,                                                    // landingshjelp: 0 = av, 1 = på
  // Race the Sunset og Wiggle the World: toppfart [start, økning per x, maks], lufttyngde, tyngde når man holder (lufta / bakken)
  upK: 0.8, downK: 1.4, camMin: 0.26,
  spd: [2300, 0.008, 3000], airG: 0.95, diveLow: 1.45, holdLow: 1.15,
  aT: 0.04, aK: [1, 0.8, 1.25, 0.65, 1.6, 0.5, 2.1, 2.8, 3.6, 0.38, 0.28, 0.2, 0.14], aM: [1, 0.93, 1.08, 0.85, 1.16, 1.26, 0.78],   // samme sidejustering som Fly High
};
let genShape = [1, 1, 1, 0], rollLeft = 0, effSpeed = 1000, section = null;
// Bakken settes sammen av seksjoner i tilfeldig rekkefølge, så banen aldri blir lik.
// Hver form: [bredde, høyde, ekstra bredde på nedoversiden, hvor mye høyere (+) eller lavere (−) neste dal ligger]
const SECTIONS = [
  ['rolling',  0.28, [3, 5], () => { const b = pickShape(); return [b[0], b[1], 1, 0]; }],
  ['bumps',    0.13, [3, 5], () => [rand(0.55, 0.7), rand(0.38, 0.5), 1, 0]],
  ['launch',   0.17, [1, 2], () => [rand(0.95, 1.1), rand(1.55, 1.8), rand(1.8, 2.1), -120]],   // høyt hopp med lang landingsbakke
  ['giant',    0.12, [1, 2], () => [rand(1.5, 1.7), rand(1.45, 1.6), 1.15, -80]],             // kjempedal
  ['uphill',   0.15, [3, 4], () => [rand(0.85, 1), rand(0.8, 0.95), 0.8, 95]],               // trappetrinn oppover
  ['downhill', 0.15, [3, 4], () => [rand(0.9, 1.05), rand(0.9, 1.05), 1.3, -95]],            // lang tur nedover
  ['waves',    0.13, [4, 6], () => (waveK++ % 2 ? [rand(0.55, 0.65), rand(0.45, 0.55), 1, 0] : [rand(1.05, 1.2), rand(1.25, 1.45), 1.2, 0])],   // liten, stor, liten, stor
  ['ramp',     0.1,  [1, 2], () => [rand(0.72, 0.85), rand(1.6, 1.85), rand(1.7, 2.0), -70]],   // bratt hopprampe
  ['dips',     0.1,  [2, 3], () => [rand(0.6, 0.72), rand(1.1, 1.3), 1.15, 0]],             // smale, dype daler
];
let waveK = 0;
function nextShape(y) {
  if (!section || section.left <= 0) {
    let k = Math.random() * SECTIONS.reduce((a, s2) => a + s2[1], 0), pickS = SECTIONS[0];
    for (const S2 of SECTIONS) { k -= S2[1]; if (k <= 0) { pickS = S2; break; } }
    if ((pickS[0] === 'uphill' && y > 260) || (pickS[0] === 'downhill' && y < -380) || pickS[0] === (section && section.name)) pickS = SECTIONS[0];
    if (hillCount < 3) pickS = SECTIONS[0];                                      // rolig start
    section = { name: pickS[0], left: pickS[2][0] + ((Math.random() * (pickS[2][1] - pickS[2][0] + 1)) | 0), make: pickS[3] };
  }
  section.left--;
  return section.make();
}
let pts, candies, props = [], checkpoints, nextCheckpointX, levelEndX, hillCount, colorCounter, genTheme;
function resetTerrain() {
  pts = [];
  candies = [];
  props = [];
  checkpoints = [];
  colorCounter = 0;
  hillCount = 0;
  levelEndX = null;
  treasurePlaced = false; treasurePending = false; treasureTries = 0; section = null;
  genTheme = level;
  nextCheckpointX = 16000;
  pts.push({ x: -900, y: 0, peak: false, c: 0, t: genTheme });
  pts.push({ x: 0, y: 380, peak: true, c: 0, t: genTheme });   // Pom starter på toppen av første bakke
  while (pts[pts.length - 1].x < 5000) addPoint();
}
function addPoint() {
  const L = pts[pts.length - 1];
  const isPeak = !L.peak;
  let w, amp, lv = null;
  if (mode === 'levels') {
    lv = LV();
    const prog = clamp(L.x / lv.len, 0, 1);       // litt vanskeligere utover i nivået
    const T2 = TUNE.levelW, A2 = TUNE.levelA;
    w = rand(T2[0] + level * T2[1], T2[2] + level * T2[3]) * (1 + prog * 0.1);
    amp = rand(A2[0] + level * A2[1], A2[2] + level * A2[3]) * (1 + prog * 0.15);
    if (levelEndX !== null && L.x >= levelEndX) { w = 900; amp = 110; } // rolig utløp etter regnbuen
  } else if (mode === 'high') {
    const d = Math.max(0, L.x) / 5500;            // Fly High: bakkene blir stadig dypere og høyere
    w = rand(420, 560) * (1 + d * 0.4);
    amp = rand(240, 330) * (1 + d * 0.55);
  } else {
    const d = clamp(L.x / 80000, 0, 1.2);         // Race the Sunset: samme sukkerspinnbane, litt større bakker utover
    w = rand(TUNE.sunsetW[0], TUNE.sunsetW[1]) * (1 + d * 0.2);
    amp = rand(TUNE.sunsetA[0], TUNE.sunsetA[1]) * (1 + d * 0.3);
  }
  // variasjon: hver bakke får sin egen form (liten kul, høy og bratt, bred og dyp, vanlig)
  if (L.x > 300 && mode !== 'high') { w *= genShape[0] * (isPeak ? TUNE.upK : genShape[2] * TUNE.downK); amp *= genShape[1]; }
  else if (L.x > 300) { w *= genShape[0]; amp *= genShape[1]; }
  // fart og høyde: rask Pom får lengre bakker (lettere å treffe nedoversiden), treg Pom får tette bakker
  if (L.x > 300 && mode !== 'high' && TUNE.adapt[1] > 0) {

  let y, c = L.c, t = L.t;
  if (isPeak) {
    y = L.y + amp;
  } else {
    y = mode === 'high' ? clamp(L.y - amp, -280 - amp * 0.5, 160) : clamp(L.y - amp + (L.x > 300 ? genShape[3] : 0), -520, 420);

  if (mode === 'levels') {
    if (!isPeak && levelEndX === null && p.x >= lv.len) { levelEndX = p.x; return; }
    if (levelEndX !== null) return;
  } else if (!isPeak && p.x > nextCheckpointX) {
    // regnbue: mer sollys
    checkpoints.push({ x: p.x, passed: false, n: checkpoints.length + 2 });
    nextCheckpointX = p.x + 18000 + checkpoints.length * 5000;
    return;
  }

  // de første bakkene: en rad godteri like over nedoverbakken, lett å få tak i
  if (!isPeak && hillCount <= 4) {
    for (let k = 0; k < 3; k++) {
      const x = lerp(L.x, p.x, 0.3 + k * 0.17);
      candies.push({ kind: 'candy', x, y: ground(x) + 46, c: (k + hillCount) % CANDY.length, got: false, spin: Math.random() * 6 });
    }

  // sukkertøy i en bue over noen av toppene

    const n = 3 + (Math.random() * 3 | 0);
    const h0 = (level === 0 && mode === 'levels') ? 90 + Math.random() * 120 : 140 + Math.random() * 200;
    for (let i = 0; i < n; i++) {
      const tt = i / (n - 1) - 0.5;
      candies.push({ kind: 'candy', x: p.x + 120 + tt * 360, y: p.y + h0 - tt * tt * 240, c: (Math.random() * CANDY.length) | 0, got: false, spin: Math.random() * 6 });
    }
  } else if (mode === 'high' && isPeak && p.x > 3000 && Math.random() < 0.5) {
    // godterisøyle høyt oppe for dem som tør å fly
    const h0 = amp * 1.2;
    for (let i = 0; i < 4; i++) candies.push({ kind: 'candy', x: p.x + 300 + i * 90, y: p.y + h0 + i * amp * 0.15, c: i % 6, got: false, spin: Math.random() * 6 });
  } else if (isPeak && p.x > 3000 && Math.random() < snackP) {
    // hundekjeks høyt over toppen – belønning for lange svev
    candies.push({ kind: 'snack', x: p.x + 250 + Math.random() * 200, y: p.y + 300 + Math.random() * 180, c: 0, got: false, spin: Math.random() * 6 });
  }
}
// Velger formen på neste bakke: liten kul, vanlig, høy hopp-bakke, bred og dyp dal, eller en rekke små kuler
function pickShape() {
  const jit = () => rand(0.88, 1.12);
  if (rollLeft > 0) { rollLeft--; return [TUNE.rollShape[0] * jit(), TUNE.rollShape[1] * jit()]; }
  let k = Math.random();
  for (const sh of TUNE.shapes) {
    k -= sh[0];
    if (k <= 0) {
      if (sh[1] === 'roll') { rollLeft = 1 + (Math.random() * 2 | 0); return [TUNE.rollShape[0] * jit(), TUNE.rollShape[1] * jit()]; }

}
function ensureTerrain(toX) {
  while (pts[pts.length - 1].x < toX) addPoint();

  while (pts.length > 8 && pts[2].x < cam.x - 3000) pts.shift();
  if (candies.length && candies[0].x < cam.x - 3000) candies = candies.filter(c => c.x > cam.x - 3000);

// ---------- Fysikk ----------
function tangent(x) { const sl = slope(x), len = Math.hypot(1, sl); return [1 / len, sl / len]; }

const BEAM_AT = 3, POWER_AT = 7, POWER_TIME = 5;

function land(gy) {
  const [tx, ty] = tangent(p.x);
  const sp = Math.hypot(p.vx, p.vy);
  const along = p.vx * tx + p.vy * ty;
  const cos = along / (sp || 1);
  const airTime = p.air;
  if (window.__flights && p.air > 0.3) window.__flights.push([p.x - p.tx, p.apex - p.ty, p.air, Math.hypot(p.vx, p.vy), ty, cos]);
  p.y = gy; p.ground = true; p.air = 0; p.beam = 0; p.beamOn = false; assist.k = assist.tk = 1; assist.dvx = 0; assist.t = 0;
  let s = along;
  const playing = state === 'play';
  if (playing && airTime >= 0.3) { maxAir = Math.max(maxAir, airTime); maxHop = Math.max(maxHop, pts.filter(q => !q.peak && q.x > p.tx && q.x < p.x).length); }
  if (!playing || airTime < 0.3) {
    // liten hopp – ingen vurdering
  } else if (cos > 0.88 && ty < -0.03) {
    combo++; perfectCount++; buzz(15); window.FF_pomEvent && FF_pomEvent('perfect');
    bestCombo = Math.max(bestCombo, combo);
    s = sp + 160 + Math.min(combo, 6) * 25;
    bonus += 100 * Math.min(combo, 10) * (powerT > 0 ? 2 : 1);
    popup(combo > 1 ? `Perfect x${combo}!` : 'Perfect!', UI.rose);
    burst(p.x, p.y, 18, ['#ffffff', '#ffb0d6', '#cbb8ff', '#a6e3ff'], 260);
    sfx.perfect(combo);

    if (combo % POWER_AT === 0) startPower(sp);
  } else if (powerT > 0) {

  } else {

      yelp(); bark(1.05, 2, 0.24); flops++; buzz([40, 30, 40]);
      combo = 0;
    } else if (cos < 0.88) popup('Bumpy landing', UI.inkSoft);   // humpete: rekka beholdes
    s = Math.max(along * (cos < 0.75 ? 0.8 : 0.9), sp * (cos < 0.75 ? 0.55 : 0.7), MIN_SPEED);

function startPower(sp) {

// Skatten plasseres midt i svevet Pom akkurat har startet, litt over banen, og trekkes mot Pom
function spawnTreasure() {
  let x = p.x, y = p.y, vx = Math.max(p.vx, 120), vy = p.vy;

function step(dt) {
  const asleep = state === 'sleep' || state === 'over';
  const coasting = state === 'done';
  const heavy = holding && state === 'play';
  const hi = mode === 'high';
  const g = heavy ? G_HOLD * (hi ? 1 : TUNE.holdLow) : G_NORMAL;
  const ga = (heavy ? G_HOLD * (hi ? TUNE.dive : TUNE.diveLow) : G_AIR * (hi ? 1 : TUNE.airG)) * (hi ? clamp(0.85 - p.y / 45000, 0.4, 0.85) : 1);   // tynnere luft høyt oppe
  if (p.ground) {
    const [tx, ty] = tangent(p.x);
    let s = p.vx * tx + p.vy * ty;
    s += -g * ty * dt;                     // tyngdekraften langs bakken
    s -= s * (asleep ? 1.6 : coasting ? 0.4 : 0.03) * dt;   // friksjon / luftmotstand
    if (powerT > 0 && state === 'play') s = Math.max(s, powerSpeed);
    s = asleep ? clamp(s, 0, maxSpeed()) : clamp(s, MIN_SPEED, maxSpeed());
    p.vx = s * tx; p.vy = s * ty;
    const nx = p.x + p.vx * dt;
    const ballY = p.y + p.vy * dt - 0.5 * ga * dt * dt;
    const gy = ground(nx);
    if (ballY > gy && s > 300) {
      p.ground = false; p.x = nx; p.y = ballY; p.vy -= ga * dt; p.air = 0; p.tx = p.x; p.ty = p.y; p.apex = p.y;
      if (state === 'play') {
        if (treasurePending) spawnTreasure();
        if (combo >= BEAM_AT) { p.beamOn = true; p.beam = 0.9; sfx.beam(); }   // regnbuestråle fra hopp nr. 4
        else if (p.vy > 250) sfx.launch();
      }
    } else { p.x = nx; p.y = gy; }
  } else {
    // landingshjelp: styrer svevet litt så Pom treffer en nedoverside
    let gEff = ga;
    if (TUNE.assist && state === 'play') {
      assistUpdate(dt, ga);
      gEff = ga * assist.k;
      if (assist.dvx) { const d = assist.dvx * Math.min(1, dt / 0.25); p.vx += d; assist.dvx -= d; }
    }
    p.vy -= gEff * dt;
    if (p.beam > 0) {                       // regnbuestrålen gir et lite løft framover
      const k = Math.min(1, p.beam * 2);
      p.vx += 520 * k * dt; p.vy += 420 * k * dt; p.beam -= dt;
    }

    p.x += p.vx * dt; p.y += p.vy * dt;
    p.air += dt;
    if (p.y > p.apex) p.apex = p.y;
    const gy = ground(p.x);

  }
}

// Pom-rompas posisjon i verden (der regnbuestrålen kommer ut)
function buttPos() {

    if (Math.random() < 0.6) particles.push({ x: bx, y: by, vx: rand(-160, -40), vy: rand(-60, 60), life: 0.7, t: 0, r: 4 + Math.random() * 4, c: pick(st.cols, (Math.random() * 10) | 0), shape: st.part });
  }
  for (const b of beamPts) b.t += dt;
  beamPts = beamPts.filter(b => b.t < 0.75);

  // spor
  trail.push({ x: p.x, y: p.y + POM_R * 0.9 });
  if (trail.length > 40) trail.shift();

  // partikler
  for (const q of particles) { q.t += dt; q.vy -= 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.98; }
  particles = particles.filter(q => q.t < q.life);
  for (const u of popups) u.t += dt;
  popups = popups.filter(u => u.t < 1.3);

  // kamera: følger pom og zoomer ut når den flyr høyt
  const bs = baseScale();
  // bakken der Pom kommer til å lande skal synes nederst; ellers holdes kameraet nært Pom
  const landX = (!isIdle() && !p.ground) ? predictLanding() : p.x + 500;
  const low = Math.min(ground(p.x), ground(p.x + 500), ground(landX), p.y) - 120;
  const apexY = (mode !== 'high' && !p.ground && p.vy > 0) ? p.y + Math.min(p.vy * p.vy / (2 * G_AIR * TUNE.airG), 2500) : p.y;
  const high = Math.max(apexY + POM_R * 3 + 60 + ((mode === 'high' ? 110 : 40) + safeTop()) / cam.s, low + 560);   // plass til HUD over Pom
  const needH = high - low;
  const minS = mode === 'high' ? bs * 0.45 : bs * TUNE.camMin;
  const targetS = clamp(Math.min(bs, H / needH), minS, bs);
  cam.s += (targetS - cam.s) * Math.min(1, dt * (mode === 'high' ? 1.6 : 3));   // raskere utzoom så bakken holdes i bildet
  const spare = H / cam.s - needH;   // ekstra himmel (f.eks. stående mobil) – sentrer bakken litt
  const targetY = low - Math.max(0, spare) * (isIdle() ? 0.5 : 0.4);
  const viewH = H / cam.s;
  if (true) {   // samme kamera i alle moduser: følger Pom raskt og stabilt, og Pom er alltid i bildet
    // myk overgang (0 = nær bakken, 1 = høyt oppe) i stedet for et brått av/på-skifte
    const span = H / minS, k = mode === 'high' ? clamp((p.y - low - span * 0.45) / (span * 0.35), 0, 1) : clamp((needH - span * 0.95) / (span * 0.3), 0, 1);
    const kk = k * k * (3 - 2 * k);
    if (mode === 'high') cam.s += (bs * 0.95 - cam.s) * Math.min(1, dt * 1.6) * kk;   // bare Fly High zoomer inn igjen høyt oppe
    const vH = H / cam.s, RATE = 7;
    // fartskompensasjon: kameraet sikter dit Pom er på vei, så det ikke henger etter
    const lead = clamp(p.vy / RATE + p.vy * 0.06, -vH * 0.3, vH * 0.3);
    cam.lead = (cam.lead || 0) + (lead - (cam.lead || 0)) * Math.min(1, dt * (mode !== 'high' && (save.shake === false || save.calm) ? 4 : 6));   // uten risting: mykere kamera ved landing
    const follow = mode === 'high' ? p.y - vH * 0.5 + cam.lead : p.y + POM_R * 1.6 + ((H > W ? 92 : 62) + safeTop()) / cam.s - vH;
    const camTarget = targetY + (follow - targetY) * kk;
    cam.y += (camTarget - cam.y) * Math.min(1, dt * RATE);
    // sikkerhetsmarg: Pom holdes alltid synlig under HUD-en og over bunnen
    const topM = (mode === 'high' ? POM_R * 2.8 + (115 + safeTop()) / cam.s : POM_R * 1.6 + ((H > W ? 92 : 62) + safeTop()) / cam.s), botM = POM_R * 0.6 + 34 / cam.s;
    cam.y = Math.min(p.y - botM, Math.max(cam.y, p.y + topM - vH));
  } else {
  const above = p.y - low > (H / minS) * 0.78;   // langt over bakken: følg Pom og zoom inn igjen
  if (above) cam.s += (bs * (mode === 'high' ? 0.95 : 0.62) - cam.s) * Math.min(1, dt * 1.5);
  const camTarget = above ? p.y - viewH * 0.55 : targetY;
  cam.y += (camTarget - cam.y) * Math.min(1, dt * 3.5);
  }
  cam.x = p.x - (W * (isIdle() ? 0.5 : 0.24)) / cam.s;
  cam.shake = Math.max(0, cam.shake - dt * 30);
  { const dx = cam.x - (parPrev ?? cam.x); parX += Math.abs(dx) < 4000 ? dx * cam.s : 0; parPrev = cam.x; }
}

// ---------- Landingshjelp ----------
// Mens Pom er i lufta prøver spillet ulike små justeringer (litt mer/mindre tyngde, litt mer/mindre fart
// framover) og velger den minste som gir landing på en nedoverside med fin vinkel.
const assist = { k: 1, tk: 1, dvx: 0, t: 0 };
function simLand(x, y, vx, vy, g) {
  const dt = 1 / 40;
  for (let i = 0; i < 260; i++) {
    vy -= g * dt; x += Math.max(vx, 120) * dt; y += vy * dt;
    const gy = ground(x);
    if (y <= gy) {
      const sl = slope(x), len = Math.hypot(1, sl), tx = 1 / len, ty = sl / len, sp = Math.hypot(vx, vy);
      return { x, ty, cos: (vx * tx + vy * ty) / sp };
    }
  }
  return null;
}
const landScore = r => !r ? -9 : (r.ty < -0.04 ? r.cos : r.cos - 2);
function assistUpdate(dt, ga) {
  assist.k += (assist.tk - assist.k) * Math.min(1, dt * 5);
  assist.t -= dt;
  if (assist.t > 0) return;
  assist.t = mode === 'high' ? 0.08 : TUNE.aT;
  if (p.vy > 0 && p.air < 0.1) return;                        // rett etter avhopp: la Pom stige
  const base = simLand(p.x, p.y, p.vx, p.vy, ga);
  if (base && base.ty < -0.04 && base.cos > 0.92) { assist.tk = 1; return; }
  let best = null, bestCost = 1e9;
  const KS = mode === 'high' ? [1, 0.8, 1.25, 0.65, 1.6, 0.5, 2.1, 2.8, 0.38, 0.28, 0.2] : TUNE.aK, MS = mode === 'high' ? [1, 0.93, 1.08, 0.85, 1.16, 1.26, 0.78] : TUNE.aM;
  for (const k of KS) for (const m of MS) {
    const rr = simLand(p.x, p.y, p.vx * m, p.vy, ga * k);
    const sc = landScore(rr);
    const cost = (sc > 0.92 ? 0 : sc > 0.8 ? 3 : 10 + (1 - sc) * 5) + Math.abs(Math.log(k)) + Math.abs(m - 1) * 4;
    if (cost < bestCost) { bestCost = cost; best = [k, m]; }
  }
  if (best) { assist.tk = best[0]; assist.dvx = p.vx * (best[1] - 1); }
}

// Hvor lander Pom hvis man slipper nå? (brukes av kameraet)
function predictLanding() {
  let x = p.x, y = p.y, vx = Math.max(p.vx, 120), vy = p.vy;
  const g = G_AIR * (mode === 'high' ? clamp(0.85 - p.y / 45000, 0.4, 0.85) : TUNE.airG), dt = 1 / 30;
  for (let i = 0; i < 240; i++) { vy -= g * dt; x += vx * dt; y += vy * dt; if (y <= ground(x)) return x; }
  return x;
}

// Firkantet glitterstjerne
function sparkle(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + r * 0.15, y - r * 0.15, x + r, y);
  ctx.quadraticCurveTo(x + r * 0.15, y + r * 0.15, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.15, y + r * 0.15, x - r, y);
  ctx.quadraticCurveTo(x - r * 0.15, y - r * 0.15, x, y - r);
  ctx.fill();
}
function star5(x, y, r, inner = 0.5, rot = 0) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = rot - Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * inner : r;
    k ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

  for (let i = i0; i <= i1; i++) fn(i * cell - off, i);
}
// Noe som vandrer over skjermen i egen fart (dyr, fugler, båter)
function wander(speed, span, offset, par = 0.05) {

      }
      ctx.strokeStyle = fade('#b8e6c2', 0.2); ctx.lineWidth = 2 * u;

// ---------- Vær foran alt (tuttifrutti-snø, snø, regn, konfetti) ----------
function drawWeather() {
  const T = LV().theme, u = clamp(H / 700, 0.6, 1.4);
  const drift = SCX() * 0.4;
  const wrapX = x => ((x % (W + 40)) + W + 40) % (W + 40) - 20;
  if (T.id === 'candy' || T.id === 'mountain') {
    const tutti = T.id === 'candy', n = tutti ? 45 : 70;
    for (let i = 0; i < n; i++) {
      const sp = 18 + hash(i * 2.2) * 22;
      const y = (elapsed * sp * u + hash(i * 3.1) * (H + 40)) % (H + 40) - 20;
      const x = wrapX(hash(i * 5.3) * W - drift * (0.3 + hash(i) * 0.5) + Math.sin(elapsed * 0.9 + i) * 18 * u);
      if (tutti) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(elapsed * (hash(i) - 0.5) * 3 + i);
        ctx.fillStyle = pick(['#f7c0d6', '#cdb8f0', '#b8d8f2', '#f8e6a6', '#c4e8c4', '#f9d0b0'], i);
        if (i % 3) roundRect(-4 * u, -1.5 * u, 8 * u, 3 * u, 1.5 * u); else { ctx.beginPath(); ctx.arc(0, 0, 2.6 * u, 0, 7); }
        ctx.fill(); ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x, y, (1.5 + hash(i * 7) * 2.5) * u, 0, 7); ctx.fill();
      }
    }
  } else if (T.id === 'jungle') {
    ctx.strokeStyle = 'rgba(220,240,250,0.35)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 50; i++) {
      const y = (elapsed * 420 + hash(i * 3.1) * H) % H, x = wrapX(hash(i * 5.3) * W - drift * 0.6 - y * 0.15);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 16); ctx.stroke();
    }
    const mg = ctx.createLinearGradient(0, H * 0.55, 0, H);
    mg.addColorStop(0, 'rgba(240,255,245,0)'); mg.addColorStop(1, 'rgba(240,255,245,0.18)');
    ctx.fillStyle = mg; ctx.fillRect(0, H * 0.55, W, H * 0.45);
  } else if (T.id === 'rainbow') {
    if (!isIdle()) drawBunting();
    for (let i = 0; i < 40; i++) {
      const x = wrapX(hash(i * 5.3) * W + Math.sin(elapsed * 1.3 + i) * 14 - drift * 0.3);
      const y = (elapsed * 50 * (0.5 + hash(i * 2)) + hash(i * 3) * H) % H;
      ctx.save(); ctx.translate(x, y); ctx.rotate(elapsed * 3 + i);
      ctx.fillStyle = pick(['#f7c0d2', '#f9d0b0', '#f8e6a6', '#c4e8c4', '#b8d8f2', '#d4c4f0'], i); ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
  }
}

  volcano: ['lavarock', 'vent', 'crystal', 'lavarock'],
  rainbow: ['cheerpom', 'lolly', 'candycane', 'cheerpom', 'gumdrop', 'cheerpom'],
};
const PROP_TILT = new Set(['crab', 'sandcastle', 'frog', 'scorpion', 'tumbleweed', 'gumdrop', 'lavarock', 'vent', 'crystal', 'bucket', 'cone', 'skullrock', 'yetirock', 'cloudpuff']);

function maybeProp(L, p) {
  if (p.x < 600 || Math.random() > (mode === 'levels' ? 0.6 : 0.35)) return;
  const set = PROP_SETS[THEMES[p.t].id] || PROP_SETS.candy;
  props.push({ x: lerp(L.x, p.x, rand(0.2, 0.8)), k: set[(Math.random() * set.length) | 0], s: rand(0.8, 1.15), seed: Math.random() });
}

function drawProps() {
  for (const pr of props) {
    let x = pr.x;
    if (pr.k === 'tumbleweed') x += ((elapsed * 110 + pr.seed * 600) % 800) - 400;
    if (pr.k === 'crab') x += Math.sin(elapsed * 1.3 + pr.seed * 9) * 45;
    if (x < cam.x - 300 || x > cam.x + W / cam.s + 300) continue;
    ctx.save();
    ctx.translate(wx(x), wy(ground(x)) + 5 * cam.s);
    if (PROP_TILT.has(pr.k)) ctx.rotate(-Math.atan(slope(x)));
    ctx.scale(cam.s * pr.s, cam.s * pr.s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    (PROP[pr.k] || (() => {}))(pr.seed);
    ctx.restore();
  }
}

// ---------- Bakkene ----------
function drawTerrain() {
  const d = dayAmount(), T = LV().theme, HL = T.hills;
  const x0 = cam.x - 80 / cam.s, x1 = cam.x + (W + 80) / cam.s;
  const step = Math.max(4, 7 / cam.s);
  const dusk = 1 - d;
  const tint = (c, k = 0.45) => mix(c, '#b09ad0', dusk * k);
  // kropp: én fylt flate per bakke, med gradient
  let i = segIndex(x0);
  while (i < pts.length - 1 && pts[i].x < x1) {
    const a = pts[i];
    let j = i + 1;
    const mid0 = (a.x + pts[j].x) / 2;
    const col = colorAt(mid0), th = themeAt(mid0);
    while (j < pts.length - 1 && colorAt((pts[j].x + pts[j + 1].x) / 2) === col && themeAt((pts[j].x + pts[j + 1].x) / 2) === th) j++;
    const sx = Math.max(a.x, x0), ex = Math.min(pts[j].x, x1);
    const C = THEMES[th].hills[col];
    let top = Infinity;
    ctx.beginPath();
    ctx.moveTo(wx(sx), H + 10);
    for (let x = sx; x <= ex + step; x += step) {
      const xx = Math.min(x, ex);
      const yy = wy(ground(xx));
      top = Math.min(top, yy);
      ctx.lineTo(wx(xx), yy);
    }
    ctx.lineTo(wx(ex), H + 10);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, Math.min(top, H - 1), 0, H);
    g.addColorStop(0, tint(C[0]));
    g.addColorStop(1, mix(C[2], '#6d5a9e', dusk * 0.5));
    ctx.fillStyle = g; ctx.fill();
    i = j;
  }

  // myke bobler inni bakken + glitter
  const cell = 95;
  ctx.fillStyle = `rgba(255,255,255,${(T.edge === 'lava' ? 0.08 : 0.16) + 0.08 * d})`;
  const glints = [];
  ctx.beginPath();
  for (let gx = Math.floor(x0 / cell); gx <= x1 / cell; gx++) {
    const cx = gx * cell + hash(gx) * 40;
    const gtop = ground(cx);
    for (let k = 1; k < 9; k++) {
      const cy = gtop - k * cell * 0.8 - hash(gx * 3 + k) * 40;
      const r = 18 + hash(gx * 7 + k * 13) * 26;
      if (gtop - cy < r + 26) continue;
      const sy = wy(cy);
      if (sy > H + 40) break;
      ctx.moveTo(wx(cx) + r * cam.s, sy); ctx.arc(wx(cx), sy, r * cam.s, 0, 7);
      if (hash(gx * 11 + k * 5) > 0.55) glints.push([wx(cx) + r * cam.s * 0.4, sy - r * cam.s * 0.4, gx * 3 + k]);
    }
  }
  ctx.fill();
  for (const [gx, gy, n] of glints) {
    const tw = Math.sin(elapsed * 2.5 + n);
    if (tw < 0.1) continue;
    ctx.globalAlpha = tw * 0.9;
    sparkle(gx, gy, (3 + hash(n) * 4) * Math.max(0.7, cam.s) * tw, '#ffffff');
  }
  ctx.globalAlpha = 1;

  // kanten tegnes per tema (i Race the Sunset kan to verdener synes samtidig)
  let xa = x0, th = themeAt(x0);
  for (let k = segIndex(x0); k < pts.length - 1 && pts[k].x < x1; k++) {
    const t = themeAt((pts[k].x + pts[k + 1].x) / 2);
    if (t !== th) { drawEdge(THEMES[th].edge, xa, pts[k].x, THEMES[th].hills, tint, dusk); xa = pts[k].x; th = t; }
  }
  drawEdge(THEMES[th].edge, xa, x1, THEMES[th].hills, tint, dusk);
}

// Kaller cb(fargeindeks, punkter) for hver strekning av overflaten med samme bakkefarge
function surfaceRuns(x0, x1, cb) {
  const step = Math.max(4, 7 / cam.s);
  let run = [], col = colorAt(x0);
  for (let x = x0; x <= x1 + step; x += step) {
    const c = colorAt(x), pt = [wx(x), wy(ground(x))];
    if (c !== col) { run.push(pt); cb(col, run); run = [pt]; col = c; } else run.push(pt);
  }
  if (run.length > 1) cb(col, run);
}
function strokeRun(run, dy = 0) {
  ctx.beginPath();
  run.forEach(([x, y], i) => i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy));
  ctx.stroke();
}
function drawEdge(style, x0, x1, HL, tint, dusk) {
  const s = cam.s;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (style === 'puff') {
    const spacing = 24;
    const ga = Math.floor(x0 / spacing), gb = Math.ceil(x1 / spacing);
    for (let pass = 0; pass < 2; pass++) {
      for (let k = ga; k <= gb; k++) {
        const cx = k * spacing + (hash(k) - 0.5) * 10;
        const r = 15 + hash(k * 1.7) * 10;
        const C = HL[colorAt(cx)];
        const sx = wx(cx), sy = wy(ground(cx) - r * 0.62), sr = r * s;
        if (pass === 0) { ctx.fillStyle = tint(C[0]); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill(); }
        else { ctx.fillStyle = mix(C[1], '#d9c9ee', dusk * 0.5); ctx.beginPath(); ctx.arc(sx - sr * 0.22, sy - sr * 0.28, sr * 0.58, 0, 7); ctx.fill(); }
      }
    }
  } else if (style === 'sand' || style === 'snow') {
    const snow = style === 'snow';
    surfaceRuns(x0, x1, (c, run) => {
      ctx.strokeStyle = snow ? mix('#fbfbff', '#d9d0f0', dusk * 0.5) : tint(HL[c][1]);
      ctx.lineWidth = (snow ? 16 : 10) * s; strokeRun(run, (snow ? 5 : 3) * s);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2.5 * s; strokeRun(run, -1 * s);
    });
    const sp = snow ? 30 : 40;
    for (let k = Math.floor(x0 / sp); k <= x1 / sp; k++) {
      const x = k * sp + hash(k) * 20, gy = wy(ground(x));
      if (snow) {
        ctx.fillStyle = mix('#fbfbff', '#d9d0f0', dusk * 0.5);
        ctx.beginPath(); ctx.arc(wx(x), gy + 12 * s, (4 + hash(k * 2.3) * 5) * s, 0, 7); ctx.fill();
      }
      const tw = Math.sin(elapsed * 3 + k);
      if (tw > 0.3 && hash(k * 3.1) > 0.4) { ctx.globalAlpha = tw; sparkle(wx(x), gy + 4 * s, 4 * Math.max(0.7, s), '#ffffff'); ctx.globalAlpha = 1; }
    }
  } else if (style === 'grass') {
    surfaceRuns(x0, x1, (c, run) => { ctx.strokeStyle = tint(HL[c][1]); ctx.lineWidth = 10 * s; strokeRun(run, 3 * s); });
    const sp = 14;
    for (let k = Math.floor(x0 / sp); k <= x1 / sp; k++) {
      const x = k * sp, gy = wy(ground(x)), sx = wx(x);
      const C = HL[colorAt(x)], h = (8 + hash(k) * 10) * s, sway = Math.sin(elapsed * 2 + k * 0.7) * 3 * s;
      ctx.fillStyle = mix(C[2], '#9d86b8', dusk * 0.45);
      ctx.beginPath(); ctx.moveTo(sx - 3 * s, gy + 3 * s); ctx.lineTo(sx + sway, gy - h); ctx.lineTo(sx + 3 * s, gy + 3 * s); ctx.fill();
      if (hash(k * 3.3) > 0.93) {
        ctx.fillStyle = pick(['#ffffff', '#f7c9da', '#fff1a1', '#d6c8f2'], k);
        for (let pI = 0; pI < 5; pI++) { const a = pI * 1.257; ctx.beginPath(); ctx.arc(sx + sway + Math.cos(a) * 3 * s, gy - h + Math.sin(a) * 3 * s, 2.6 * s, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#f2c46a'; ctx.beginPath(); ctx.arc(sx + sway, gy - h, 1.8 * s, 0, 7); ctx.fill();
      }
    }
  } else if (style === 'road') {
    surfaceRuns(x0, x1, (c, run) => {
      ctx.strokeStyle = tint(HL[c][1]); ctx.lineWidth = 22 * s; strokeRun(run, 9 * s);
      ctx.strokeStyle = mix(HL[c][2], '#7d6b8e', 0.35 + dusk * 0.2); ctx.lineWidth = 15 * s; strokeRun(run, 9 * s);
      ctx.setLineDash([14 * s, 14 * s]); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5 * s; strokeRun(run, 9 * s); ctx.setLineDash([]);
    });
  } else if (style === 'frosting') {
    const icing = mix('#fffaf6', '#d9d0f0', dusk * 0.5);
    surfaceRuns(x0, x1, (c, run) => { ctx.strokeStyle = icing; ctx.lineWidth = 14 * s; strokeRun(run, 5 * s); });
    for (let k = Math.floor(x0 / 26); k <= x1 / 26; k++) {
      const x = k * 26 + hash(k) * 8, gy = wy(ground(x)), sx = wx(x);
      ctx.fillStyle = icing;
      const len = (6 + hash(k * 2.7) * 16) * s;
      roundRect(sx - 4 * s, gy + 6 * s, 8 * s, len, 4 * s); ctx.fill();
      ctx.beginPath(); ctx.arc(sx, gy + 6 * s + len, 4.5 * s, 0, 7); ctx.fill();
      ctx.fillStyle = pick(['#e98aa8', '#9fd3b8', '#a9c8e6', '#f2dea0', '#c9b6f0'], k);
      ctx.save(); ctx.translate(sx + 8 * s, gy + 3 * s); ctx.rotate(hash(k * 5) * 3); ctx.fillRect(-3 * s, -1 * s, 6 * s, 2 * s); ctx.restore();
    }
  } else if (style === 'lava') {
    const pulse = 0.7 + 0.3 * Math.sin(elapsed * 3);
    surfaceRuns(x0, x1, (c, run) => {
      ctx.strokeStyle = tint(HL[c][1]); ctx.lineWidth = 12 * s; strokeRun(run, 5 * s);
      ctx.shadowColor = '#ffb38a'; ctx.shadowBlur = 12;
      ctx.strokeStyle = `rgba(255,184,154,${pulse})`; ctx.lineWidth = 4 * s; strokeRun(run, 1 * s);
      ctx.shadowBlur = 0;
    });
    for (let k = Math.floor(x0 / 60); k <= x1 / 60; k++) {
      const x = k * 60 + hash(k) * 30, t = (elapsed * 0.7 + hash(k * 2)) % 1;
      ctx.fillStyle = `rgba(255,194,158,${1 - t})`;
      ctx.beginPath(); ctx.arc(wx(x) + Math.sin(t * 6 + k) * 4 * s, wy(ground(x) + t * 60), 2.5 * s, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

// Regnbuen ved slutten av nivået
function drawRainbow(gx) {
  if (gx < cam.x - 900 || gx > cam.x + W / cam.s + 900) return;
  const sx = wx(gx), base = wy(ground(gx));
  const R0 = 340 * cam.s, band = 24 * cam.s;
  const cols = ['#e7a1b5', '#f0bf9f', '#f2dea0', '#bcdab4', '#a9c8e6', '#bfaee0'];
  ctx.save();
  ctx.lineWidth = band + 1;
  cols.forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(sx, base + 40 * cam.s, R0 - i * band, Math.PI, 0); ctx.stroke();
  });
  for (let k = 0; k < 8; k++) {
    const a = Math.PI + (k + 0.5) / 8 * Math.PI, tw = Math.sin(elapsed * 3 + k * 1.3);
    if (tw > 0.2) { ctx.globalAlpha = tw; sparkle(sx + Math.cos(a) * (R0 + 18 * cam.s), base + 40 * cam.s + Math.sin(a) * (R0 + 18 * cam.s), 7 * Math.max(0.7, cam.s), '#ffffff'); }
  }
  ctx.globalAlpha = 1;
  for (const side of [-1, 1]) puff(sx + side * (R0 - band * 2.5), base - 10 * cam.s, 34 * cam.s, '#fbf6f3', '#ffffff');
  ctx.restore();
}

// ---------- Samleobjekter, skatter og automatisk veksling ----------
const COLLECT = {
  candy: 'candies', tropic: 'seashells', jungle: 'bananas', desert: 'desert gems', mountain: 'snowflakes',
  city: 'gumballs', play: 'marbles', sky: 'stars', volcano: 'lava crystals', rainbow: 'rainbow hearts',
};
const TREASURES = {
  candy: 'Golden Swirl', tropic: 'Pearl Shell', jungle: 'Golden Coconut', desert: "Pharaoh's Scarab",
  mountain: "Yeti's Mitten", city: 'Royal Gumball', play: 'Golden Trophy', sky: 'Star Crystal',
  volcano: 'Fire Opal', rainbow: 'Rainbow Prism',
};
const rateFor = lv => 1 + Math.floor(lv / 3);   // samleobjekter er verdt mer på senere nivåer
const SNACK_VALUE = 3, TREASURE_NEW = 50, TREASURE_AGAIN = 10;
let treasureTries = 0, treasureGot = false, treasureNew = false, treasurePlaced = false, treasurePending = false, settled = false, runRows = [], tallyShown = 0;
const treasureCount = () => THEMES.filter((t, i) => save.treasures[i]).length;
const allTreasures = () => treasureCount() >= THEMES.length;

function exchangeRows() {
  const rows = [];
  if (mode === 'levels') {
    const id = LV().theme.id, rate = rateFor(level);
    rows.push({ icon: id, label: `${candyCount} ${COLLECT[id]} × ${rate}`, value: candyCount * rate });
  } else rows.push({ icon: 'candy', label: `${candyCount} candies`, value: candyCount });
  if (snackCount) rows.push({ icon: 'snack', label: `${snackCount} snacks × ${SNACK_VALUE}`, value: snackCount * SNACK_VALUE });
  if (treasureGot) {
    const name = TREASURES[LV().theme.id];
    rows.push({ icon: 'treasure', label: treasureNew ? `${name} (new!)` : `${name} (again)`, value: treasureNew ? TREASURE_NEW : TREASURE_AGAIN });
  }
  return rows;
}
// Veksler inn alt man har samlet til godteri i lommeboka – én gang per runde
function settleRun() {
  if (settled) return;
  settled = true;
  runRows = exchangeRows();
  earned = runRows.reduce((a, r) => a + r.value, 0);
  save.wallet += earned;
  if (mode === 'levels') {
    const id = LV().theme.id;
    save.collected[id] = (save.collected[id] || 0) + candyCount;
    if (treasureGot) save.treasures[level] = true;
  }
  tallyShown = 0;
  persist();
}

function rowIcon(icon, x, y, r) {
  if (icon === 'snack') drawBone(x, y, r * 1.1, -0.3);
  else if (icon === 'treasure') drawTreasure(mode === 'levels' ? LV().theme.id : 'candy', x, y, r * 1.2, true);
  else drawCollectible(icon, x, y, r, 0, -0.2);
}
// Kvitteringen som teller opp vekslingen rad for rad
function drawTally(x, y, w, k, t) {
  const rowH = 30 * k;
  roundRect(x, y, w, rowH * (runRows.length + 1) + 14 * k, 14); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
  let cy = y + 7 * k + rowH / 2;
  let total = 0;
  runRows.forEach((r, i) => {
    const t0 = 0.2 + i * 0.45;
    if (t < t0) return;
    if (tallyShown <= i) { tallyShown = i + 1; sfx.candy(); }
    const f = clamp((t - t0) / 0.35, 0, 1);
    const v = Math.round(r.value * f);
    total += v;
    ctx.globalAlpha = Math.min(1, (t - t0) * 4);
    rowIcon(r.icon, x + 20, cy, 9 * k + 2);
    textOutlined(r.label, x + 38, cy, fitSize(r.label, 16 * k + 3, w - 120, 700), UI.ink, UI.outline, 'left', 700);
    textOutlined(`+${v}`, x + w - 14, cy, 17 * k + 3, UI.roseDeep, UI.outline, 'right');
    ctx.globalAlpha = 1;
    cy += rowH;
  });
  const tt = 0.2 + runRows.length * 0.45;
  if (t >= tt) {
    ctx.strokeStyle = 'rgba(108,91,123,0.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 12, cy - rowH / 2); ctx.lineTo(x + w - 12, cy - rowH / 2); ctx.stroke();
    drawCandyIcon(x + 20, cy + 2, 8 * k + 2, 0, -0.3);
    const lbl = `Total · wallet ${save.wallet}`;
    textOutlined(lbl, x + 38, cy + 2, fitSize(lbl, 16 * k + 3, w - 130, 800), UI.ink, UI.outline, 'left');
    textOutlined(`+${earned}`, x + w - 14, cy + 2, 21 * k + 3, UI.peach, UI.outline, 'right');
  }
  return y + rowH * (runRows.length + 1) + 14 * k;
}

// Samleobjekt per tema
function drawCollectible(id, x, y, r, ci = 0, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (id !== 'candy') { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, 7); ctx.fill(); }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  switch (id) {
    case 'tropic': {
      ctx.fillStyle = '#f7c0cf';
      ctx.beginPath(); ctx.moveTo(0, r * 0.9); ctx.lineTo(-r * 1.1, -r * 0.2); ctx.quadraticCurveTo(0, -r * 1.5, r * 1.1, -r * 0.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e595ad'; ctx.lineWidth = r * 0.12;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(0, r * 0.8); ctx.lineTo(k * r * 0.42, -r * 0.65 + Math.abs(k) * r * 0.2); ctx.stroke(); }
      ctx.fillStyle = '#f7c0cf'; ctx.fillRect(-r * 0.3, r * 0.6, r * 0.6, r * 0.35);
      break;
    }
    case 'jungle': {
      ctx.fillStyle = '#f6d86a';
      ctx.beginPath(); ctx.arc(0, -r * 0.9, r * 1.6, 0.5, Math.PI - 0.5); ctx.arc(0, -r * 1.6, r * 1.9, Math.PI - 0.62, 0.62, true); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d9b34a'; ctx.lineWidth = r * 0.12; ctx.stroke();
      ctx.fillStyle = '#8a6a4a'; ctx.beginPath(); ctx.arc(-r * 1.1, r * 0.05, r * 0.16, 0, 7); ctx.fill();
      break;
    }
    case 'desert': {
      const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#fbe3a0'); g.addColorStop(1, '#e8a85a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, -r * 1.1); ctx.lineTo(r * 0.85, -r * 0.3); ctx.lineTo(0, r * 1.1); ctx.lineTo(-r * 0.85, -r * 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.moveTo(0, -r * 1.1); ctx.lineTo(-r * 0.85, -r * 0.3); ctx.lineTo(-r * 0.1, -r * 0.3); ctx.closePath(); ctx.fill();
      break;
    }
    case 'mountain': {
      ctx.strokeStyle = '#a9c8e6'; ctx.lineWidth = r * 0.42;
      const flake = () => { for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55); ctx.lineTo(Math.cos(a + 0.5) * r * 0.85, Math.sin(a + 0.5) * r * 0.85); ctx.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55); ctx.lineTo(Math.cos(a - 0.5) * r * 0.85, Math.sin(a - 0.5) * r * 0.85); ctx.stroke(); } };
      flake(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = r * 0.18; flake();
      break;
    }
    case 'city': {
      ctx.fillStyle = pick(['#f7a9c4', '#9fd3e8', '#f2dea0', '#b8e3cc', '#c9b6f0'], ci);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.3, 0, 7); ctx.fill();
      break;
    }
    case 'play': {
      ctx.fillStyle = 'rgba(201,228,246,0.9)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      ctx.strokeStyle = pick(['#e7a1b5', '#bfaee0', '#f0bf9f'], ci); ctx.lineWidth = r * 0.3;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0.3, 2.6); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.22, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(108,91,123,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
      break;
    }
    case 'sky': {
      star5(0, 0, r * 1.15, 0.48, Math.sin(elapsed * 2) * 0.2);
      ctx.fillStyle = '#fff1a1'; ctx.fill(); ctx.strokeStyle = '#e8c766'; ctx.lineWidth = r * 0.1; ctx.stroke();
      break;
    }
    case 'volcano': {
      for (const [dx, h, c] of [[-r * 0.4, r * 1.3, '#f4a3b8'], [r * 0.35, r * 1.0, '#f8c49a']]) {
        ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(dx - r * 0.35, r * 0.7); ctx.lineTo(dx - r * 0.35, r * 0.7 - h * 0.7); ctx.lineTo(dx, r * 0.7 - h); ctx.lineTo(dx + r * 0.35, r * 0.7 - h * 0.7); ctx.lineTo(dx + r * 0.35, r * 0.7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(-r * 0.55, -r * 0.3, r * 0.12, r * 0.8);
      break;
    }
    case 'rainbow': {
      heartPath(0, r * 0.2, r * 1.15);
      const g = ctx.createLinearGradient(-r, -r, r, r);
      ['#e7a1b5', '#f0bf9f', '#f2dea0', '#bcdab4', '#a9c8e6', '#bfaee0'].forEach((c, i) => g.addColorStop(i / 5, c));
      ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = r * 0.15; ctx.stroke();
      break;
    }
    default: drawCandyIcon(0, 0, r, ci % 6, 0);
  }
  ctx.restore();
}

      ctx.fillStyle = '#9fd8a8'; ctx.beginPath(); ctx.ellipse(r * 0.5, -r * 1.05, r * 0.5, r * 0.2, -0.5, 0, 7); ctx.fill();
      break;
    case 'desert':
      ctx.strokeStyle = '#c99f3a'; ctx.lineWidth = r * 0.1;
      for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(s * r * 0.4, -r * 0.3 + k * r * 0.4); ctx.lineTo(s * r * 1.0, -r * 0.5 + k * r * 0.5); ctx.stroke(); }
      ctx.fillStyle = gold; ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.6, r * 0.85, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -r * 0.8, r * 0.35, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c99f3a'; ctx.lineWidth = r * 0.07; ctx.beginPath(); ctx.moveTo(0, -r * 0.6); ctx.lineTo(0, r * 0.95); ctx.stroke();
      ctx.fillStyle = '#9fd3e8'; ctx.beginPath(); ctx.arc(0, -r * 0.2, r * 0.18, 0, 7); ctx.fill();

let fireworks = [], fwTimer = 0, finaleT = 0;

function updateFireworks(dt) {

  if (S.sparkle && s === 7 && Math.random() < 0.6) voice('musicbox', degToFreq(S, chord + 7 + (Math.random() * 5 | 0), 1), t, eighth * 2, 0.04);

  if (P === 'none') return;
  if (P === 'soft' || P === 'beat' || P === 'drums') {

    if (s % 2 === 1) hat(t, P === 'soft' ? 0.025 : 0.04);

// Instrumenter (myke toner)
function voice(kind, f, t, dur, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  let type = 'triangle', att = 0.01, rel = dur, extra = null;
  switch (kind) {
    case 'bell': type = 'sine'; att = 0.005; rel = Math.max(dur, 0.5); extra = [3, 0.25]; break;
    case 'musicbox': type = 'sine'; att = 0.003; rel = Math.max(dur, 0.9); extra = [4, 0.35]; break;
    case 'marimba': type = 'sine'; att = 0.004; rel = 0.35; extra = [4, 0.3]; break;
    case 'xylo': type = 'triangle'; att = 0.003; rel = 0.28; extra = [3, 0.2]; break;
    case 'flute': type = 'sine'; att = 0.05; rel = dur * 1.05; break;
    case 'square': type = 'square'; att = 0.01; rel = dur * 0.9; vol *= 0.35; break;
    case 'pad': type = 'triangle'; att = Math.min(0.4, dur * 0.4); rel = dur; break;
    case 'arp': type = 'sine'; att = 0.005; rel = dur; break;
    case 'pluck': type = 'triangle'; att = 0.005; rel = Math.min(dur, 0.35); break;
    case 'deep': type = 'triangle'; att = 0.01; rel = dur; break;
    case 'soft': type = 'sine'; att = 0.05; rel = dur; break;
  }
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (kind === 'flute' || kind === 'pad') {           // svak vibrato
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 5; lg.gain.value = f * 0.006; lfo.connect(lg).connect(o.frequency); lfo.start(t); lfo.stop(t + rel + 0.1);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + rel);
  o.connect(g).connect(music.bus); o.start(t); o.stop(t + att + rel + 0.05);
  if (extra) {   // lys overtone for bjelle/marimba

    o2.type = 'sine'; o2.frequency.setValueAtTime(f * extra[0], t);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * extra[1], t + 0.003); g2.gain.exponentialRampToValueAtTime(0.0001, t + rel * 0.35);
    o2.connect(g2).connect(music.bus); o2.start(t); o2.stop(t + rel * 0.4 + 0.05);
  }
}
function kick(t, v) {
  const o = ac.createOscillator(), g = ac.createGain();

}
function noiseHit(t, v, freq, type, len) {
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + len);

const hat = (t, v) => noiseHit(t, v, 7000, 'highpass', 0.05);
const snare = (t, v) => { noiseHit(t, v, 1800, 'bandpass', 0.14); };
function bongo(t, k) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(320 * k, t); o.frequency.exponentialRampToValueAtTime(220 * k, t + 0.1);

// Hvilken sang passer nå?
function wantedSong() {
  if (isIdle()) return 'menu';
  if (state === 'sleep' || state === 'over') return 'lullaby';
  if (mode === 'sunset') return 'sunset';
  if (mode === 'high') return 'high';
  return LV().theme.id;
}
function setMusic(on) { save.music = on; persist(); if (on) initAudio(); }

// ---------- Tegning ----------
function wx(x) { return (x - cam.x) * cam.s; }
function wy(y) { return H - (y - cam.y) * cam.s; }

function dayAmount() {
  if (isIdle()) return 1;
  // fra full dag ved start til natt når tiden er ute
  const t = clamp(timeLeft / Math.min(Math.max(timeMax, 20), 45), 0, 1);
  return t * t * (3 - 2 * t);
}

function puff(x, y, r, col, hl) {
  ctx.fillStyle = col;
  const k = [[-1.1, 0.25, 0.62], [-0.5, -0.15, 0.85], [0.2, -0.35, 1], [0.95, 0, 0.75], [1.5, 0.3, 0.5], [0.3, 0.3, 0.8]];
  ctx.beginPath();
  for (const [dx, dy, rr] of k) { ctx.moveTo(x + dx * r + rr * r, y + dy * r); ctx.arc(x + dx * r, y + dy * r, rr * r, 0, 7); }
  ctx.fill();
  if (hl) {
    ctx.fillStyle = hl;
    ctx.beginPath();
    for (const [dx, dy, rr] of k.slice(1, 4)) { ctx.moveTo(x + dx * r - rr * r * 0.25 + rr * r * 0.5, y + dy * r - rr * r * 0.3); ctx.arc(x + dx * r - rr * r * 0.25, y + dy * r - rr * r * 0.3, rr * r * 0.5, 0, 7); }
    ctx.fill();
  }
}
function bgClouds(par, cell, yMin, yMax, alpha, seed) {
  const d = dayAmount();
  const off = SCX() * par;
  const i0 = Math.floor(off / cell) - 1, i1 = Math.floor((off + W) / cell) + 1;
  ctx.globalAlpha = alpha;
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 13.7 + seed * 101);
    if (h1 < 0.25) continue;
    const x = i * cell - off + hash(i + seed * 7) * cell * 0.5;
    const y = H * lerp(yMin, yMax, hash(i * 3.1 + seed));
    const r = (22 + hash(i * 5.3 + seed) * 30) * (seed === 2 ? 1.3 : 0.9);
    const col = HILLS()[(i * 7 + seed * 3 & 0xffff) % 6];
    puff(x, y, r, mix(col[2], col[1], 0.35 + 0.5 * d), mix(col[0], '#ffffff', 0.4 + 0.4 * d));
  }
  ctx.globalAlpha = 1;
}

function drawCandy(c) {
  const sx = wx(c.x), sy = wy(c.y + Math.sin(elapsed * 3 + c.spin) * 6);
  if (c.kind === 'snack') { drawBone(sx, sy, 20 * cam.s, Math.sin(elapsed * 2 + c.spin) * 0.25 - 0.3); return; }
  if (c.kind === 'treasure') { drawTreasure(LV().theme.id, sx, sy, 24 * Math.max(0.7, cam.s)); return; }
  const id = mode === 'levels' ? LV().theme.id : 'candy';
  if (id === 'candy') drawCandyIcon(sx, sy, 13 * cam.s, c.c, Math.sin(elapsed * 2 + c.spin) * 0.3);
  else drawCollectible(id, sx, sy, 13 * cam.s, c.c, Math.sin(elapsed * 2 + c.spin) * 0.25);
}
function drawCandyIcon(sx, sy, r, ci, rot = 0) {
  const C = CANDY[ci];
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot);
  ctx.fillStyle = C[2];
  ctx.beginPath(); ctx.moveTo(-r * 0.8, 0); ctx.lineTo(-r * 1.9, -r * 0.75); ctx.lineTo(-r * 1.9, r * 0.75); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r * 0.8, 0); ctx.lineTo(r * 1.9, -r * 0.75); ctx.lineTo(r * 1.9, r * 0.75); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C[0]; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = Math.max(1.5, r * 0.22);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.55, -2.6, 0.3); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.22, 0, 7); ctx.fill();
  ctx.restore();
}
// Hundekjeks (snack) formet som et lite bein
function drawBone(sx, sy, r, rot = 0) {
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, 7); ctx.fill();
  const body = () => {
    ctx.beginPath();
    for (const [x, y] of [[-1, -0.32], [-1, 0.32], [1, -0.32], [1, 0.32]]) { ctx.moveTo(x * r + r * 0.34, y * r); ctx.arc(x * r, y * r, r * 0.34, 0, 7); }
    ctx.rect(-r, -r * 0.24, 2 * r, r * 0.48);
  };
  ctx.lineWidth = r * 0.22; ctx.strokeStyle = '#fffaf2'; body(); ctx.stroke();
  ctx.fillStyle = '#e2b885'; body(); ctx.fill();
  ctx.fillStyle = '#c7955f';
  for (const [x, y] of [[-0.35, 0.02], [0.1, -0.06], [0.5, 0.05]]) { ctx.beginPath(); ctx.arc(x * r, y * r, r * 0.06, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.13, r * 0.4, r * 0.05, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// Pelsdott: en "stjerne" med mange myke tagger, gir pomeranian-pels
function fluff(x, y, r, spikes, color, seed, wob = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i <= spikes * 2; i++) {
    const a = (i / (spikes * 2)) * Math.PI * 2;
    const rr = (i % 2 === 0 ? r : r * 0.8) * (1 + (hash(seed + i) - 0.5) * 0.12) + (i % 2 === 0 ? Math.sin(elapsed * 9 + i) * wob : 0);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py);
    else {
      const am = ((i - 0.5) / (spikes * 2)) * Math.PI * 2;
      const rm = r * 0.93;
      ctx.quadraticCurveTo(x + Math.cos(am) * rm, y + Math.sin(am) * rm, px, py);
    }
  }
  ctx.closePath(); ctx.fill();
}

function drawPom() {
  const sx = wx(p.x), sy = wy(p.y);
  const s = cam.s;
  const R = POM_R;
  const fast = Math.hypot(p.vx, p.vy);
  const playing = state === 'play';
  const heavy = holding && playing;
  const idle = isIdle();
  const breathe = idle ? Math.sin(elapsed * 3) * 0.03 : 0;

  // skygge på bakken
  const gy = wy(ground(p.x));
  const hgt = Math.max(0, p.y - ground(p.x));
  const sh = clamp(1 - hgt / 600, 0.2, 1);
  ctx.fillStyle = `rgba(120,70,140,${0.18 * sh})`;
  ctx.beginPath(); ctx.ellipse(sx, gy + 2, R * 1.3 * s * sh, R * 0.3 * s * sh, 0, 0, 7); ctx.fill();

  const asleep = state === 'over' || (state === 'sleep' && p.sleep > 0.5) || (state === 'paused' && pausedFrom === 'sleep' && p.sleep > 0.5);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-p.ang);
  ctx.scale(s, s);
  // squish ved dykk/landing
  ctx.scale(1 + (heavy ? 0.14 : 0) + p.squish * 0.2 + breathe, 1 - (heavy ? 0.14 : 0) - p.squish * 0.18 - breathe * 0.5);
  if (powerT > 0) {
    // Power Pom: glitrer i alle farger
    const hue = (elapsed * (save.calm ? 50 : 500)) % 360;
    ctx.shadowColor = `hsl(${hue},95%,75%)`; ctx.shadowBlur = 22;
    const gr = ctx.createRadialGradient(R * 0.2, -R * 1.3, 4, R * 0.2, -R * 1.3, R * 2.4);
    gr.addColorStop(0, `hsla(${hue},95%,85%,0.55)`); gr.addColorStop(1, `hsla(${(hue + 120) % 360},95%,85%,0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(R * 0.2, -R * 1.3, R * 2.4, 0, 7); ctx.fill();
  }
  window.__pomScreen = [sx, sy, s];
  if (window.FF_gamePom) {
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';   // gløden er allerede tegnet bak Pom
    const dt2 = Math.min(1 / 30, (performance.now() - (window.__gpT || performance.now())) / 1000) || 1 / 60; window.__gpT = performance.now();
    window.FF_gamePom(ctx, { dt: dt2, S: R * GAME_POM_S, speed: fast, vy: p.vy, air: !p.ground, dive: heavy, power: powerT > 0 && playing,
      run: Math.min(26, 6 + fast / 70), tongue: (fast > 1100 || powerT > 0) && playing, sleep: asleep, blink: p.blink > 0 && !heavy,
      win: state === 'done', idle: idle && !asleep && state !== 'done' });
  } else drawPomModel(save.look, {
    inAir: !p.ground, heavy,
    run: p.ground && !idle && state !== 'over' ? elapsed * Math.min(26, 6 + fast / 70) : 0,
    tongue: (fast > 1100 || powerT > 0) && playing,
    asleep, blink: p.blink > 0 || (heavy && p.ground),
  });
  ctx.restore();

  // zzz
  if (asleep) {
    ctx.fillStyle = UI.lav; ctx.textAlign = 'left';
    for (let k = 0; k < 3; k++) {
      const t = (elapsed * 0.6 + k / 3) % 1;
      ctx.globalAlpha = 1 - t;
      ctx.font = `800 ${(14 + k * 5) * Math.max(0.8, s)}px ${FONT}`;
      ctx.fillText('z', sx + (20 + t * 30) * s, sy - (70 + t * 60) * s);
    }
    ctx.globalAlpha = 1;
  }
}

// Pelsfarger: o = hovedfarge, d = mørk kant, c = bryst/snute, l = lys hale
const FUR = {
  orange: { o: '#f6a04d', d: '#d9762c', c: '#ffe9c9', l: '#ffc27a' },
  cream:  { o: '#f3d9ad', d: '#d6b27f', c: '#fff6e6', l: '#fbe8c8' },
  white:  { o: '#fbf8f4', d: '#ddd3cc', c: '#ffffff', l: '#ffffff' },
  choc:   { o: '#9a6142', d: '#74462e', c: '#d9b08c', l: '#b47a55' },
  tan:    { o: '#4a3d40', d: '#2c2426', c: '#d99a5b', l: '#66575a' },
  pink:   { o: '#f4b6cd', d: '#d98aa9', c: '#fde3ee', l: '#fbd0e1' },
};

// Tegner Pom i lokale koordinater: føttene i (0,0), ser mot +x, størrelse POM_R.
function drawPomModel(look, o = {}) {
  const R = POM_R;
  const F = FUR[look.fur] || FUR.orange;
  const inAir = !!o.inAir, heavy = !!o.heavy;
  const wob = inAir ? 1.4 : 0.5;
  const run = o.run || 0;
  drawBack(look.back, R, 'behind', inAir);

  // bein
  ctx.fillStyle = F.d;
  const legY = -R * 0.32;
  const legs = [[-R * 0.55, 0], [-R * 0.25, Math.PI], [R * 0.35, Math.PI * 0.5], [R * 0.62, Math.PI * 1.5]];
  for (const [lx, ph] of legs) {
    let dx = 0, len = R * 0.42;
    if (inAir) { dx = lx < 0 ? -R * 0.25 : R * 0.25; len = R * 0.36; }
    else if (heavy) { len = R * 0.28; }
    else if (run) dx = Math.sin(run + ph) * R * 0.18;
    ctx.beginPath(); ctx.ellipse(lx + dx * 0.6, legY + len * 0.5, R * 0.13, len * 0.55, dx * 0.02, 0, 7); ctx.fill();
  }

  // hale – stor fluffy krøll på ryggen
  const tw = Math.sin(elapsed * (inAir ? 14 : 7)) * 0.12;
  ctx.save(); ctx.translate(-R * 0.75, -R * 1.45); ctx.rotate(tw);
  fluff(0, 0, R * 0.62, 11, F.d, 3, wob);
  fluff(-R * 0.05, -R * 0.06, R * 0.5, 10, F.l, 5, wob);
  ctx.restore();

  // kropp
  fluff(0, -R * 0.95, R * 1.08, 16, F.d, 11, wob);
  fluff(0, -R * 0.98, R * 0.98, 16, F.o, 17, wob);
  // brystmanke
  fluff(R * 0.48, -R * 0.95, R * 0.58, 11, F.c, 23, wob * 0.6);
  drawBack(look.back, R, 'front', inAir);

  // ører (bak hodet)
  const earFlap = inAir ? Math.sin(elapsed * 20) * 0.18 : 0;
  for (const [ex, er] of [[R * 0.45, -0.35], [R * 0.98, 0.25]]) {
    ctx.save(); ctx.translate(ex, -R * 2.1); ctx.rotate(er + earFlap - (heavy ? 0.5 : 0));
    ctx.fillStyle = F.d;
    ctx.beginPath(); ctx.moveTo(-R * 0.22, R * 0.15); ctx.quadraticCurveTo(-R * 0.05, -R * 0.55, 0, -R * 0.5); ctx.quadraticCurveTo(R * 0.12, -R * 0.4, R * 0.22, R * 0.15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffb3c8';
    ctx.beginPath(); ctx.moveTo(-R * 0.1, R * 0.08); ctx.lineTo(0, -R * 0.3); ctx.lineTo(R * 0.1, R * 0.08); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // hode
  const hx = R * 0.78, hy = -R * 1.72;
  fluff(hx, hy, R * 0.7, 13, F.d, 31, wob);
  fluff(hx, hy, R * 0.62, 13, F.o, 37, wob);
  // snute
  ctx.fillStyle = F.c;
  ctx.beginPath(); ctx.ellipse(hx + R * 0.42, hy + R * 0.14, R * 0.3, R * 0.22, 0, 0, 7); ctx.fill();
  // nese
  ctx.fillStyle = '#3a2433';
  ctx.beginPath(); ctx.ellipse(hx + R * 0.68, hy + R * 0.04, R * 0.1, R * 0.08, 0, 0, 7); ctx.fill();
  // tunge når det går fort eller powerpom
  if (o.tongue) {
    ctx.fillStyle = '#ff7aa8';
    ctx.beginPath(); ctx.ellipse(hx + R * 0.42, hy + R * 0.4, R * 0.1, R * 0.17, -0.4, 0, 7); ctx.fill();
  }
  // munn
  ctx.strokeStyle = '#3a2433'; ctx.lineWidth = R * 0.05; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hx + R * 0.5, hy + R * 0.2, R * 0.1, 0.2, Math.PI - 0.6); ctx.stroke();
  // rødme
  ctx.fillStyle = 'rgba(255,120,160,0.45)';
  ctx.beginPath(); ctx.ellipse(hx + R * 0.12, hy + R * 0.22, R * 0.14, R * 0.08, 0, 0, 7); ctx.fill();
  // øye (lys ring rundt på mørk pels så det synes)
  if (look.fur === 'tan') {
    ctx.fillStyle = '#d99a5b';
    ctx.beginPath(); ctx.ellipse(hx + R * 0.22, hy - R * 0.15, R * 0.17, R * 0.19, 0, 0, 7); ctx.fill();
  }
  if (o.asleep || o.blink) {
    ctx.strokeStyle = '#3a2433';
    ctx.beginPath(); ctx.arc(hx + R * 0.22, hy - R * 0.14, R * 0.12, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    ctx.fillStyle = '#2b1a26';
    ctx.beginPath(); ctx.ellipse(hx + R * 0.22, hy - R * 0.15, R * 0.12, R * 0.14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(hx + R * 0.26, hy - R * 0.2, R * 0.045, 0, 7); ctx.fill();
  }

  drawNeck(look.neck, R, inAir);
  drawGlasses(look.glasses, hx, hy, R);
  drawHat(look.hat, hx, hy, R);
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}

function drawHatBase(id, hx, hy, R) {
  if (!id || id === 'none') return;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (id === 'party') {
    ctx.translate(hx - R * 0.08, hy - R * 0.5); ctx.rotate(-0.28);
    ctx.beginPath(); ctx.moveTo(-R * 0.34, 0); ctx.lineTo(0, -R * 1.0); ctx.lineTo(R * 0.34, 0); ctx.quadraticCurveTo(0, R * 0.12, -R * 0.34, 0); ctx.closePath();
    ctx.fillStyle = '#b9a3e3'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = '#f3b6cf'; ctx.lineWidth = R * 0.12;
    for (let k = -2; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-R * 0.6, -k * R * 0.28); ctx.lineTo(R * 0.6, -k * R * 0.28 - R * 0.35); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = '#8f76c4'; ctx.lineWidth = R * 0.04;
    ctx.beginPath(); ctx.moveTo(-R * 0.34, 0); ctx.lineTo(0, -R * 1.0); ctx.lineTo(R * 0.34, 0); ctx.stroke();
    fluff(0, -R * 1.02, R * 0.16, 8, '#f2dea0', 41, 0);
  } else if (id === 'beanie') {
    ctx.translate(hx - R * 0.04, hy - R * 0.28); ctx.rotate(-0.12);
    ctx.fillStyle = '#a9c8e6';
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.68, R * 0.55, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = R * 0.05;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * R * 0.22, 0); ctx.quadraticCurveTo(k * R * 0.2, -R * 0.3, k * R * 0.1, -R * 0.5); ctx.stroke(); }
    ctx.fillStyle = '#8ea8c3'; roundRect(-R * 0.72, -R * 0.1, R * 1.44, R * 0.24, R * 0.12); ctx.fill();
    fluff(0, -R * 0.6, R * 0.22, 9, '#fbf6f3', 43, 0);
  } else if (id === 'flowers') {
    const cols = ['#f3b6cf', '#fff1a1', '#c9b6f0', '#ffffff', '#f0bf9f', '#a9d8e8'];
    for (let i = 0; i < 6; i++) {
      const a = -2.75 + i * 0.4;
      const fx = hx + Math.cos(a) * R * 0.6, fy = hy + Math.sin(a) * R * 0.6;

      ctx.beginPath(); ctx.ellipse(fx + R * 0.1, fy + R * 0.02, R * 0.09, R * 0.04, a, 0, 7); ctx.fill();

    }
  } else if (id === 'crown') {
    ctx.translate(hx + R * 0.02, hy - R * 0.55); ctx.rotate(-0.12);

    ctx.moveTo(-R * 0.38, 0); ctx.lineTo(-R * 0.44, -R * 0.46); ctx.lineTo(-R * 0.2, -R * 0.22); ctx.lineTo(0, -R * 0.56);
    ctx.lineTo(R * 0.2, -R * 0.22); ctx.lineTo(R * 0.44, -R * 0.46); ctx.lineTo(R * 0.38, 0); ctx.closePath();
    ctx.fillStyle = '#efcf78'; ctx.fill();
    ctx.strokeStyle = '#c99f3a'; ctx.lineWidth = R * 0.05; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-R * 0.34, -R * 0.12, R * 0.68, R * 0.05);
    for (const [x, y, c] of [[-R * 0.44, -R * 0.48, '#e7a1b5'], [0, -R * 0.58, '#a9c8e6'], [R * 0.44, -R * 0.48, '#e7a1b5']]) {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, R * 0.07, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#bfaee0'; ctx.beginPath(); ctx.arc(0, -R * 0.1, R * 0.07, 0, 7); ctx.fill();
  } else if (id === 'unicorn') {
    ctx.translate(hx + R * 0.22, hy - R * 0.52); ctx.rotate(0.38);
    const g = ctx.createLinearGradient(0, 0, 0, -R * 0.8);
    g.addColorStop(0, '#e7a1b5'); g.addColorStop(0.35, '#f2dea0'); g.addColorStop(0.7, '#a9c8e6'); g.addColorStop(1, '#bfaee0');
    ctx.beginPath(); ctx.moveTo(-R * 0.15, 0); ctx.lineTo(0, -R * 0.85); ctx.lineTo(R * 0.15, 0); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = R * 0.04;
    for (let k = 1; k < 4; k++) { const y = -k * R * 0.2, w = R * 0.15 * (1 - k * 0.24); ctx.beginPath(); ctx.moveTo(-w, y + R * 0.05); ctx.lineTo(w, y - R * 0.04); ctx.stroke(); }
  }
  ctx.restore();
}

function drawGlassesBase(id, hx, hy, R) {

}

function drawNeckBase(id, R, inAir) {

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 0.3, -R * 0.17); ctx.quadraticCurveTo(R * 0.36, 0, R * 0.3, R * 0.17); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a26f86'; ctx.beginPath(); ctx.arc(0, 0, R * 0.08, 0, 7); ctx.fill();

    for (const [x, y] of [[-0.15, -0.03], [0.12, -0.06], [0.0, 0.14], [0.2, 0.08], [-0.02, 0.28]]) { ctx.beginPath(); ctx.arc(x * R, y * R, R * 0.035, 0, 7); ctx.fill(); }
    ctx.strokeStyle = '#8ea8c3'; ctx.lineWidth = R * 0.04;

  } else if (id === 'scarf') {
    const flap = Math.sin(elapsed * (inAir ? 18 : 6)) * R * 0.08;

    ctx.beginPath(); ctx.moveTo(nx - R * 0.4, ny - R * 0.12); ctx.lineTo(nx - R * 1.05, ny - R * 0.02 + flap); ctx.lineTo(nx - R * 1.0, ny + R * 0.2 + flap); ctx.lineTo(nx - R * 0.35, ny + R * 0.12); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(nx, ny); ctx.rotate(-0.12);
    roundRect(-R * 0.48, -R * 0.15, R * 0.92, R * 0.3, R * 0.14); ctx.fill();
    ctx.fillStyle = '#fbf6f3';
    for (let k = -1; k <= 1; k++) ctx.fillRect(k * R * 0.28 - R * 0.04, -R * 0.15, R * 0.08, R * 0.3);
    ctx.restore();
  } else if (id === 'pearls') {
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const x = nx + lerp(-R * 0.36, R * 0.38, t);
      const y = ny - R * 0.12 + Math.sin(t * Math.PI) * R * 0.3;
      ctx.fillStyle = '#fbf8f4'; ctx.beginPath(); ctx.arc(x, y, R * 0.075, 0, 7); ctx.fill();
      ctx.strokeStyle = '#d6cbd8'; ctx.lineWidth = R * 0.02; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x - R * 0.02, y - R * 0.025, R * 0.022, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawHat(id, hx, hy, R) {
  if (!['bunny', 'chef', 'cowboy', 'halo', 'bow', 'explorer'].includes(id)) return drawHatBase(id, hx, hy, R);
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (id === 'bunny') {
    ctx.strokeStyle = '#f2a9c4'; ctx.lineWidth = R * 0.08;

      ctx.save(); ctx.translate(hx + ox * R, hy - R * 0.52); ctx.rotate(rot + Math.sin(elapsed * 3 + ox * 9) * 0.06);
      ctx.fillStyle = '#fbf8f4'; ctx.beginPath(); ctx.ellipse(0, -R * 0.5, R * 0.16, R * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#f7c9da'; ctx.beginPath(); ctx.ellipse(0, -R * 0.5, R * 0.08, R * 0.42, 0, 0, 7); ctx.fill();

  } else if (id === 'chef') {

    roundRect(-R * 0.36, -R * 0.36, R * 0.72, R * 0.4, R * 0.06); ctx.fill();
    ctx.strokeStyle = '#e6dde8'; ctx.lineWidth = R * 0.03;
    ctx.beginPath(); ctx.moveTo(-R * 0.36, -R * 0.06); ctx.lineTo(R * 0.36, -R * 0.06); ctx.stroke();
  } else if (id === 'cowboy') {
    ctx.translate(hx, hy - R * 0.52); ctx.rotate(-0.12);
    ctx.fillStyle = '#d9a98a';
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.78, R * 0.14, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-R * 0.38, 0); ctx.quadraticCurveTo(-R * 0.44, -R * 0.56, -R * 0.1, -R * 0.5);
    ctx.quadraticCurveTo(0, -R * 0.4, R * 0.1, -R * 0.5); ctx.quadraticCurveTo(R * 0.44, -R * 0.56, R * 0.38, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c48a9f'; ctx.fillRect(-R * 0.39, -R * 0.17, R * 0.78, R * 0.1);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-R * 0.15, -R * 0.36, R * 0.08, R * 0.05, -0.4, 0, 7); ctx.fill();
  } else if (id === 'explorer') {
    ctx.translate(hx, hy - R * 0.48); ctx.rotate(-0.12);
    ctx.fillStyle = '#e8d5a8'; ctx.beginPath(); ctx.ellipse(0, 0, R * 0.82, R * 0.16, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -R * 0.06, R * 0.46, R * 0.44, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#a2836a'; ctx.fillRect(-R * 0.46, -R * 0.16, R * 0.92, R * 0.1);
    ctx.fillStyle = '#f2cf74'; star5(R * 0.24, -R * 0.11, R * 0.09, 0.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-R * 0.15, -R * 0.3, R * 0.08, R * 0.05, -0.4, 0, 7); ctx.fill();
  } else if (id === 'halo') {
    ctx.translate(hx + R * 0.05, hy - R * 0.98 + Math.sin(elapsed * 3) * R * 0.05);
    ctx.shadowColor = '#fff1a1'; ctx.shadowBlur = R * 0.6;
    ctx.strokeStyle = '#f2d77a'; ctx.lineWidth = R * 0.1;
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.42, R * 0.12, -0.1, 0, 7); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = R * 0.03;
    ctx.beginPath(); ctx.ellipse(0, -R * 0.02, R * 0.36, R * 0.08, -0.1, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
  } else if (id === 'bow') {
    ctx.translate(hx + R * 0.08, hy - R * 0.6); ctx.rotate(-0.3);

    ctx.fillStyle = '#d987a8'; ctx.beginPath(); ctx.arc(0, 0, R * 0.09, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (const x of [-0.26, -0.14, 0.18, 0.28]) { ctx.beginPath(); ctx.arc(x * R, (x > 0 ? -0.03 : 0.03) * R, R * 0.025, 0, 7); ctx.fill(); }
  }
