}

function drawGlasses(id, hx, hy, R) {
  if (!['star', 'monocle', 'goggles'].includes(id)) return drawGlassesBase(id, hx, hy, R);
  const ex = hx + R * 0.22, ey = hy - R * 0.15;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (id === 'goggles') {
    ctx.strokeStyle = '#a9c8e6'; ctx.lineWidth = R * 0.12;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx - R * 0.58, ey - R * 0.14); ctx.stroke();
    roundRect(ex - R * 0.24, ey - R * 0.18, R * 0.52, R * 0.36, R * 0.16);
    const g = ctx.createLinearGradient(ex, ey - R * 0.18, ex, ey + R * 0.18);
    g.addColorStop(0, '#e1d6f6'); g.addColorStop(1, '#a9c8e6');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = R * 0.05; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = R * 0.035;
    ctx.beginPath(); ctx.moveTo(ex - R * 0.1, ey - R * 0.08); ctx.lineTo(ex + R * 0.02, ey - R * 0.08); ctx.stroke();
  } else if (id === 'star') {
    ctx.strokeStyle = '#d8bd84'; ctx.lineWidth = R * 0.05;
    ctx.beginPath(); ctx.moveTo(ex - R * 0.2, ey - R * 0.02); ctx.lineTo(hx - R * 0.38, ey - R * 0.08); ctx.stroke();
    star5(ex, ey, R * 0.25, 0.5);
    ctx.fillStyle = '#f2dea0'; ctx.fill();
    ctx.strokeStyle = '#d8bd84'; ctx.lineWidth = R * 0.04; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(ex - R * 0.06, ey - R * 0.07, R * 0.04, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(230,240,255,0.35)';
    ctx.beginPath(); ctx.arc(ex, ey, R * 0.17, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d8bd84'; ctx.lineWidth = R * 0.05; ctx.stroke();
    ctx.lineWidth = R * 0.025;
    ctx.beginPath(); ctx.moveTo(ex - R * 0.1, ey + R * 0.14); ctx.quadraticCurveTo(ex - R * 0.3, ey + R * 0.6, hx - R * 0.2, hy + R * 0.5); ctx.stroke();
  }
  ctx.restore();
}

function drawNeck(id, R, inAir) {
  if (!['lei', 'bell', 'tie'].includes(id)) return drawNeckBase(id, R, inAir);
  const nx = R * 0.6, ny = -R * 1.08;
  ctx.save();
  if (id === 'lei') {
    const cols = ['#f7c9da', '#fff1a1', '#d6c8f2', '#c9e4f6', '#f0bf9f'];
    for (let i = 0; i <= 9; i++) {
      const t = i / 9, x = nx + lerp(-R * 0.42, R * 0.4, t), y = ny - R * 0.14 + Math.sin(t * Math.PI) * R * 0.32;
      ctx.fillStyle = cols[i % cols.length];
      for (let k = 0; k < 5; k++) { const a = k * 1.257 + i; ctx.beginPath(); ctx.arc(x + Math.cos(a) * R * 0.05, y + Math.sin(a) * R * 0.05, R * 0.05, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#f2c46a'; ctx.beginPath(); ctx.arc(x, y, R * 0.025, 0, 7); ctx.fill();
    }
  } else if (id === 'bell') {
    ctx.translate(nx, ny); ctx.rotate(-0.12);
    roundRect(-R * 0.45, -R * 0.1, R * 0.9, R * 0.2, R * 0.1); ctx.fillStyle = '#c48a9f'; ctx.fill();
    const sw = Math.sin(elapsed * (inAir ? 14 : 6)) * 0.25;
    ctx.save(); ctx.translate(R * 0.08, R * 0.08); ctx.rotate(sw);
    ctx.fillStyle = '#f2cf74'; ctx.beginPath(); ctx.arc(0, R * 0.13, R * 0.13, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c99f3a'; ctx.lineWidth = R * 0.03; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-R * 0.06, R * 0.17); ctx.lineTo(R * 0.06, R * 0.17); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(-R * 0.04, R * 0.08, R * 0.03, 0, 7); ctx.fill();
    ctx.restore();
  } else if (id === 'tie') {
    ctx.translate(nx + R * 0.02, ny);
    ctx.fillStyle = '#9a84cc';
    ctx.beginPath(); ctx.moveTo(-R * 0.09, -R * 0.08); ctx.lineTo(R * 0.09, -R * 0.08); ctx.lineTo(R * 0.06, R * 0.06); ctx.lineTo(-R * 0.06, R * 0.06); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-R * 0.05, R * 0.06); ctx.lineTo(R * 0.05, R * 0.06); ctx.lineTo(R * 0.12, R * 0.48); ctx.lineTo(0, R * 0.6); ctx.lineTo(-R * 0.1, R * 0.48); ctx.fill();
    ctx.strokeStyle = '#d6c8f2'; ctx.lineWidth = R * 0.035;
    for (const y of [0.18, 0.32, 0.46]) { ctx.beginPath(); ctx.moveTo(-R * 0.08, y * R); ctx.lineTo(R * 0.09, (y - 0.06) * R); ctx.stroke(); }
  }
  ctx.restore();
}

// Ting på ryggen: vinger, kappe og ballong bak kroppen, ryggsekk foran
function drawBack(id, R, layer, inAir) {
  if (!id || id === 'none') return;
  const front = id === 'backpack';
  if ((layer === 'front') !== front) return;
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const flap = Math.sin(elapsed * (inAir ? 22 : 5)) * (inAir ? 0.35 : 0.1);
  if (id === 'wings' || id === 'angel') {
    ctx.translate(-R * 0.05, -R * 1.85);
    for (const [sc, a0] of [[1.35, -0.15], [1.1, 0.3]]) {
      ctx.save(); ctx.rotate(-0.6 + a0 + flap); ctx.scale(sc, sc);
      if (id === 'wings') {
        ctx.fillStyle = 'rgba(201,228,246,0.8)'; ctx.strokeStyle = '#bfaee0'; ctx.lineWidth = R * 0.04;
        ctx.beginPath(); ctx.ellipse(-R * 0.55, -R * 0.3, R * 0.6, R * 0.32, -0.5, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(247,201,218,0.8)';
        ctx.beginPath(); ctx.ellipse(-R * 0.42, R * 0.15, R * 0.38, R * 0.2, 0.4, 0, 7); ctx.fill(); ctx.stroke();
        ctx.globalAlpha = Math.max(0, Math.sin(elapsed * 4)); sparkle(-R * 0.7, -R * 0.4, R * 0.12, '#ffffff'); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#e6dde8'; ctx.lineWidth = R * 0.03;
        for (let f = 0; f < 4; f++) {
          ctx.beginPath(); ctx.ellipse(-R * (0.3 + f * 0.2), -R * (0.1 + f * 0.08), R * (0.42 - f * 0.05), R * 0.14, -0.35 - f * 0.08, 0, 7); ctx.fill(); ctx.stroke();
        }
      }
      ctx.restore();
    }
  } else if (id === 'cape') {
    const wv = Math.sin(elapsed * (inAir ? 16 : 5));
    ctx.fillStyle = '#e7a1b5';
    ctx.beginPath(); ctx.moveTo(R * 0.35, -R * 1.3);
    ctx.quadraticCurveTo(-R * 0.6, -R * 1.55 + wv * R * 0.1, -R * 1.55, -R * 0.95 + wv * R * 0.18);
    ctx.lineTo(-R * 1.35, -R * 0.3 + wv * R * 0.12);
    ctx.quadraticCurveTo(-R * 0.5, -R * 0.7, R * 0.25, -R * 0.95); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.9; sparkle(-R * 0.95, -R * 0.85 + wv * R * 0.1, R * 0.18, '#fff1a1'); ctx.globalAlpha = 1;
  } else if (id === 'backpack') {
    ctx.translate(-R * 0.35, -R * 1.72); ctx.rotate(-0.15);
    roundRect(-R * 0.38, -R * 0.3, R * 0.7, R * 0.56, R * 0.15); ctx.fillStyle = '#a9c8e6'; ctx.fill();
    roundRect(-R * 0.26, -R * 0.02, R * 0.46, R * 0.22, R * 0.08); ctx.fillStyle = '#c9e4f6'; ctx.fill();
    ctx.fillStyle = '#8ea8c3'; roundRect(-R * 0.38, -R * 0.3, R * 0.7, R * 0.16, R * 0.08); ctx.fill();
    ctx.strokeStyle = '#8ea8c3'; ctx.lineWidth = R * 0.06;
    ctx.beginPath(); ctx.moveTo(R * 0.28, -R * 0.2); ctx.quadraticCurveTo(R * 0.7, R * 0.1, R * 0.8, R * 0.5); ctx.stroke();
  } else if (id === 'balloon') {
    const bx = -R * 0.9 + Math.sin(elapsed * 1.5) * R * 0.1, by = -R * 3.5 + Math.sin(elapsed * 2.1) * R * 0.08;
    ctx.strokeStyle = '#bfaee0'; ctx.lineWidth = R * 0.03;
    ctx.beginPath(); ctx.moveTo(-R * 0.5, -R * 1.5); ctx.quadraticCurveTo(-R * 0.9, -R * 2.3, bx, by + R * 0.45); ctx.stroke();
    heartPath(bx, by + R * 0.1, R * 0.5);
    ctx.fillStyle = '#f2a9c4'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(bx - R * 0.15, by - R * 0.12, R * 0.06, R * 0.1, -0.5, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// Liten prøve av strålen (brukes i butikken) – lokale koordinater, går mot venstre
function drawBeamSwatch(x, y, len, id) {
  const st = TRAILS[id] || TRAILS.rainbow, n = st.cols.length, bw = POM_R * 0.16;
  ctx.save(); ctx.lineCap = 'round';
  st.cols.forEach((c, k) => {
    ctx.strokeStyle = c; ctx.lineWidth = bw;
    const off = (k - (n - 1) / 2) * bw * 0.9;
    ctx.beginPath();
    for (let t = 0; t <= 1.001; t += 0.1) {
      const xx = x - t * len, yy = y + off + Math.sin(t * 6 + elapsed * 6) * bw * 0.6 * t + t * len * 0.15;
      t ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  });
  for (let k = 0; k < 3; k++) particleShape(st.part, x - len * (0.35 + k * 0.25), y - bw * 2 + Math.sin(elapsed * 4 + k) * bw, bw * 1.4, st.cols[k % n]);
  ctx.restore();
}
function particleShape(shape, x, y, r, col) {
  ctx.fillStyle = col;
  if (shape === 'sparkle') sparkle(x, y, r * 1.4, col);
  else if (shape === 'heart') { heartPath(x, y, r * 1.2); ctx.fill(); }
  else if (shape === 'star') { star5(x, y, r * 1.2, 0.45); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
}

function drawTrail() {
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // regnbuestrålen
  if (beamPts.length > 1) {
    const st = TRAILS[save.look.trail] || TRAILS.rainbow, n = st.cols.length, bw = 6 * Math.max(0.6, cam.s);
    for (let c = 0; c < n; c++) {
      ctx.strokeStyle = st.cols[c];
      for (let i = 1; i < beamPts.length; i++) {
        const a = beamPts[i - 1], b = beamPts[i];
        if (b.x < a.x || b.x - a.x > 300) continue;
        const life = 1 - b.t / 0.75;
        ctx.globalAlpha = life;
        ctx.lineWidth = bw * (0.5 + life * 0.7);
        const off = (c - (n - 1) / 2) * bw * 0.85 * (0.6 + (1 - life) * 0.8);
        ctx.beginPath(); ctx.moveTo(wx(a.x), wy(a.y) + off); ctx.lineTo(wx(b.x), wy(b.y) + off); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  // myk glidestripe i lufta
  if (!p.ground && !p.beamOn && trail.length > 2) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5 * cam.s;
    ctx.beginPath();
    trail.slice(-18).forEach((t, i) => { const x = wx(t.x - POM_R * 0.6), y = wy(t.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
    const r = q.r * Math.max(0.6, cam.s);
    particleShape(q.shape || (q.star ? 'star' : 'circle'), wx(q.x), wy(q.y), r, q.c);
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function textOutlined(t, x, y, size, fill, stroke = UI.outline, align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.18); ctx.strokeStyle = stroke;
  ctx.strokeText(t, x, y); ctx.fillStyle = fill; ctx.fillText(t, x, y);
}

};

// Mindre boblete tekst enn tittelen: rund skrift, hvit ramme, myk skygge og gradient
const SP = '\u2002'; // bredere mellomrom så ordene ikke flyter sammen med den tykke rammen
function bubblyText(t, x, y, size, pal, align = 'center', font = FONT) {
  t = t.replace(/ /g, SP);
  ctx.save();
  ctx.font = `800 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.28; ctx.strokeStyle = 'rgba(108,91,123,0.22)';
  ctx.strokeText(t, x + size * 0.03, y + size * 0.07);
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#ffffff';
  ctx.strokeText(t, x, y);
  const g = ctx.createLinearGradient(0, y - size * 0.45, 0, y + size * 0.4);
  g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[0]); g.addColorStop(1, pal[1]);
  ctx.fillStyle = g; ctx.fillText(t, x, y);
  ctx.restore();
}

function wrapLines(text, size, maxW, font = FONT, weight = 800) {
  ctx.font = `${weight} ${size}px ${font}`;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test.replace(/ /g, SP)).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Shrinks a font size until the text fits the given width
function fitSize(text, size, maxW, weight = 800, font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`;
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}

function card(x, y, w, h, r = 26) {
  ctx.save();
  ctx.shadowColor = 'rgba(108,91,123,0.22)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 8;
  roundRect(x, y, w, h, r); ctx.fillStyle = UI.panel; ctx.fill();
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; roundRect(x, y, w, h, r); ctx.stroke();
}

// Stor rund knapp; registreres som trykkbar mens den tegnes
function uiButton(x, y, w, h, label, pal, onTap, o = {}) {
  const dis = !!o.disabled;
  ctx.save();
  const pr = btnPressAmount(x, y, w, h), hv = !dis && hovered(x, y, w, h) ? 1 : 0;
  const sc = 1 - pr * 0.08 + hv * 0.03;
  ctx.translate(x + w / 2, y + h / 2 - hv * 2); ctx.scale(sc, sc); ctx.translate(-x - w / 2, -y - h / 2);
  ctx.globalAlpha = dis ? 0.6 : 1;
  ctx.shadowColor = 'rgba(108,91,123,0.28)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  const r = Math.min(h / 2, 24);
  roundRect(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
  ctx.fillStyle = dis ? '#d9d1dc' : g; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.strokeStyle = '#fffaf5'; ctx.stroke();
  roundRect(x + 8, y + 4, w - 16, h * 0.3, h * 0.15); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
  const iconW = o.icon ? h * 0.55 : 0;
  const size = fitSize(label, h * 0.46, w - 24 - iconW);
  ctx.font = `800 ${size}px ${FONT}`;
  const tw = ctx.measureText(label).width;
  const cx = x + w / 2 + iconW / 2, cy = y + h / 2 + 1;
  if (o.icon === 'candy') drawCandyIcon(cx - tw / 2 - iconW * 0.55, cy, h * 0.15, 0, -0.3);
  textOutlined(label, cx, cy, size, '#ffffff', dis ? '#a99bb0' : pal[1]);
  ctx.restore();
  if (!dis) buttons.push({ x, y, w, h, onTap, label });
}

// Liten firkantet knapp med ikon (meny / tilbake)
function iconButton(x, y, s, kind, onTap) {
  ctx.save();
  const pr = btnPressAmount(x - 6, y - 6, s + 12, s + 12), sc = 1 - pr * 0.12 + (hovered(x, y, s, s) ? 0.05 : 0);
  ctx.translate(x + s / 2, y + s / 2); ctx.scale(sc, sc); ctx.translate(-x - s / 2, -y - s / 2);
  ctx.shadowColor = 'rgba(108,91,123,0.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  roundRect(x, y, s, s, s * 0.3); ctx.fillStyle = UI.chip; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.strokeStyle = UI.ink; ctx.lineWidth = s * 0.08; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cx = x + s / 2, cy = y + s / 2, k = s * 0.22;
  ctx.beginPath();
  if (kind === 'menu') {
    for (const dy of [-k * 0.9, 0, k * 0.9]) { ctx.moveTo(cx - k * 1.1, cy + dy); ctx.lineTo(cx + k * 1.1, cy + dy); }
  } else if (kind === 'gear') {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(elapsed * 0.3);
    ctx.fillStyle = UI.ink;
    for (let t = 0; t < 8; t++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-k * 0.28, -k * 1.35, k * 0.56, k * 0.6); }
    ctx.beginPath(); ctx.arc(0, 0, k * 0.95, 0, 7); ctx.fill();
    ctx.fillStyle = '#fbf6f3'; ctx.beginPath(); ctx.arc(0, 0, k * 0.4, 0, 7); ctx.fill();
    ctx.restore();
  } else {
    ctx.moveTo(cx + k * 0.3, cy - k); ctx.lineTo(cx - k * 0.7, cy); ctx.lineTo(cx + k * 0.3, cy + k);
  }
  ctx.stroke();
  ctx.restore();
  buttons.push({ x: x - 6, y: y - 6, w: s + 12, h: s + 12, onTap, label: kind });
}

function walletChip(rightX, y, h) {
  const t = String(save.wallet);

  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(t).width + h * 1.3;

  ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  drawCandyIcon(rightX - w + h * 0.5, y + h / 2, h * 0.17, 0, -0.3);
  textOutlined(t, rightX - h * 0.3, y + h / 2 + 1, size, UI.ink, UI.outline, 'right');
}

// Gammelt treskilt med planker, årer, kvister og spiker
function drawSign(x, y, w, h, paras, size) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-0.012);
  const X = -w / 2, Y = -h / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(80,50,40,0.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 7;
  roundRect(X, Y, w, h, 14); ctx.fillStyle = '#9c714a'; ctx.fill();
  ctx.restore();
  ctx.save();
  roundRect(X, Y, w, h, 14); ctx.clip();
  const n = Math.max(2, Math.round(h / 52)), ph = h / n;
  const woods = ['#c29a6e', '#b78d61', '#c6a175', '#b28759'];
  for (let i = 0; i < n; i++) {
    const py = Y + i * ph;
    ctx.fillStyle = woods[i % woods.length]; ctx.fillRect(X, py, w, ph);
    // årer
    ctx.strokeStyle = 'rgba(105,66,38,0.22)'; ctx.lineWidth = 1.3;
    for (let gI = 0; gI < 4; gI++) {
      const gy = py + ph * (0.18 + gI * 0.22);
      ctx.beginPath(); ctx.moveTo(X, gy);
      for (let gx = 0; gx <= w; gx += w / 6) ctx.quadraticCurveTo(X + gx + w / 12, gy + (hash(i * 9 + gI * 3 + gx) - 0.5) * 6, X + gx + w / 6, gy);
      ctx.stroke();
    }
    // kvist
    const kx = X + w * (0.15 + hash(i * 5.1) * 0.7), ky = py + ph * (0.3 + hash(i * 2.3) * 0.4);
    ctx.fillStyle = 'rgba(110,70,40,0.35)'; ctx.beginPath(); ctx.ellipse(kx, ky, 9, 4.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(110,70,40,0.3)'; ctx.beginPath(); ctx.ellipse(kx, ky, 15, 7.5, 0, 0, 7); ctx.stroke();
    // skjøt mellom planker
    if (i > 0) {
      ctx.fillStyle = 'rgba(85,52,28,0.55)'; ctx.fillRect(X, py - 1.5, w, 3);
      ctx.fillStyle = 'rgba(255,236,205,0.22)'; ctx.fillRect(X, py + 1.5, w, 2);
    }
  }
  // slitte kanter
  const vg = ctx.createRadialGradient(0, 0, Math.min(w, h) * 0.3, 0, 0, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(70,40,20,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(X, Y, w, h);
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = '#7a5232'; roundRect(X, Y, w, h, 14); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,230,195,0.35)'; roundRect(X + 4, Y + 4, w - 8, h - 8, 11); ctx.stroke();
  // spiker
  for (const [nx, ny] of [[X + 14, Y + 14], [X + w - 14, Y + 14], [X + 14, Y + h - 14], [X + w - 14, Y + h - 14]]) {
    ctx.fillStyle = '#6f6670'; ctx.beginPath(); ctx.arc(nx, ny, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#b9b2bb'; ctx.beginPath(); ctx.arc(nx - 1, ny - 1, 2.4, 0, 7); ctx.fill();
  }
  // tekst
  const lh = size * 1.22, pg = size * 0.45;
  let ty = Y + (h - signTextHeight(paras, size)) / 2 + lh / 2;
  for (const para of paras) {
    for (const line of para.lines) { bubblyText(line, 0, ty, size, para.pal); ty += lh; }
    ty += pg;
  }
  ctx.restore();
}
function signTextHeight(paras, size) {
  const lines = paras.reduce((a, p) => a + p.lines.length, 0);
  return lines * size * 1.22 + (paras.length - 1) * size * 0.45;
}
// Finner største tekststørrelse som får plass i skiltet
function fitSign(maxW, maxH, maxSize) {
  let size = maxSize, paras;
  for (; size > 11; size -= 0.5) {
    paras = SIGN_TEXT.map(([t, pal]) => ({ lines: wrapLines(t, size, maxW - 44), pal }));
    if (signTextHeight(paras, size) + 40 <= maxH) break;
  }
  return { size, paras, h: Math.min(maxH, signTextHeight(paras, size) + 44) };
}

// Bubbly cartoon title: every letter its own dusty pastel, with a soft drop shadow,
// a thick cream outline, a rounded gradient fill and a little gloss spot, bobbing in a wave.
function bubbleTitle(lines, cx, cy, size, interactive = false) {
  const cols = [
    ['#e3b3c4', '#c48a9f'], ['#c9bde0', '#9b8dbb'], ['#bfd2e3', '#8ea8c3'],
    ['#ecc6b6', '#d29c86'], ['#c2d9cb', '#93b2a0'], ['#ecdcb0', '#d8bd84'],
  ];
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  let n = 0;
  lines.forEach((line, li) => {
    ctx.font = `800 ${size}px ${TITLE_FONT}`;
    const spacing = -size * 0.02;
    const widths = [...line].map(ch => ctx.measureText(ch).width + spacing);
    const total = widths.reduce((a, b) => a + b, 0) - spacing;
    let x = cx - total / 2;
    const y0 = cy + li * size * 0.95;
    [...line].forEach((ch, i) => {
      if (ch === ' ') { x += widths[i]; return; }
      const [light, deep] = cols[n++ % cols.length];
      const bb = letterBounce[n] || 0, key = n;
      const y = y0 + Math.sin(elapsed * 2.4 - n * 0.55) * size * 0.05 - Math.sin(bb * Math.PI) * size * 0.35;
      const rot = Math.sin(elapsed * 1.7 + n) * 0.04 + Math.sin(bb * Math.PI * 3) * bb * 0.35;
      if (interactive) buttons.push({ x, y: y - size * 0.5, w: widths[i], h: size, instant: true, onTap: () => { letterBounce[key] = 1; beep(392 * Math.pow(1.122, key), 0.18, 'triangle', 0.06); } });
      const w = widths[i];
      ctx.save();
      ctx.translate(x + w / 2, y); ctx.rotate(rot);
      ctx.fillStyle = 'rgba(108,91,123,0.28)';
      ctx.lineWidth = size * 0.3; ctx.strokeStyle = 'rgba(108,91,123,0.28)';
      ctx.strokeText(ch, -w / 2 + size * 0.03, size * 0.08); ctx.fillText(ch, -w / 2 + size * 0.03, size * 0.08);
      ctx.lineWidth = size * 0.26; ctx.strokeStyle = UI.outline;
      ctx.strokeText(ch, -w / 2, 0);
      ctx.lineWidth = size * 0.07; ctx.strokeStyle = deep;
      ctx.strokeText(ch, -w / 2, 0);
      const g = ctx.createLinearGradient(0, -size * 0.45, 0, size * 0.4);
      g.addColorStop(0, light); g.addColorStop(0.55, light); g.addColorStop(1, deep);
      ctx.fillStyle = g; ctx.fillText(ch, -w / 2, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.ellipse(-w * 0.12, -size * 0.2, size * 0.07, size * 0.04, -0.5, 0, 7); ctx.fill();
      ctx.restore();
      x += w;
    });
  });
}

// ---------- Hovedmeny ----------
function menuWide() { return W > H * 1.15; }
function menuPomX() { return state === 'shop' ? 0.5 : (menuWide() ? 0.86 : 0.14); }

// ---------- Interaktiv hjemskjerm ----------
let ptr = { x: -1, y: -1, mouse: false };
let pendingTap = null;              // knappen som er trykket (spiller av en liten «klem» før handlingen)
let menuFx = [], menuCandies = [], menuCandyT = 0;
let menuPomState = { jump: 0, bubble: '', bubbleT: 0, x: 0, y: 0, s: 1, idleT: 3, spin: 0 };
let letterBounce = {};
const POM_LINES = ['Woof!', "Let's fly!", 'Pet me!', 'So fluffy!', 'Candy?', 'Wiggle time!', 'Yip yip!', 'Boop!'];

function sameRect(a, b) { return a && b && Math.abs(a.x - b.x) < 1 && Math.abs(a.y - b.y) < 1 && Math.abs(a.w - b.w) < 1; }
function btnPressAmount(x, y, w, h) {
  if (!pendingTap || !sameRect(pendingTap.bt, { x, y, w })) return 0;
  return clamp(1 - (performance.now() - pendingTap.t) / 140, 0, 1);
}
function hovered(x, y, w, h) { return ptr.mouse && ptr.x >= x && ptr.x <= x + w && ptr.y >= y && ptr.y <= y + h; }

function petPom() {
  const m = menuPomState;
  m.jump = 1; m.bubble = pick(POM_LINES, (Math.random() * POM_LINES.length) | 0); m.bubbleT = 1.8; m.idleT = 4;
  if (Math.random() < 0.25) m.spin = 1;
  bark(1.1 + Math.random() * 0.15, 1 + (Math.random() * 2 | 0));

}
function updateMenuFx(dt) {
  const m = menuPomState;
  m.jump = Math.max(0, m.jump - dt * 1.6); m.bubbleT -= dt; m.spin = Math.max(0, m.spin - dt * 1.3);
  m.idleT -= dt;
  if (m.idleT < 0) { m.idleT = rand(3, 6); m.jump = 0.55; if (Math.random() < 0.5) { m.bubble = pick(POM_LINES, (Math.random() * 8) | 0); m.bubbleT = 1.4; } }
  for (const k in letterBounce) letterBounce[k] = Math.max(0, letterBounce[k] - dt * 2.5);
  for (const f of menuFx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.k === 'heart' ? 40 : 300) * dt; }
  menuFx = menuFx.filter(f => f.t < f.life);
  if (state === 'menu') {
    menuCandyT -= dt;
    if (menuCandyT <= 0 && menuCandies.length < 7) { menuCandyT = rand(0.9, 1.8); menuCandies.push({ x: rand(30, W - 30), y: H + 30, vy: rand(-45, -70), ph: Math.random() * 6, c: (Math.random() * 6) | 0, r: rand(11, 16) }); }
  }
  for (const c of menuCandies) { c.y += c.vy * dt; c.ph += dt; }
  menuCandies = menuCandies.filter(c => c.y > -40 && !c.popped);
}
function popCandy(c) {
  c.popped = true; sfx.candy();
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; menuFx.push({ x: c.x, y: c.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, t: 0, life: 0.6, k: 'spark', c: CANDY[c.c][0] }); }
}
function drawMenuCandies() {

}
function drawMenuFx() {

}

// Felles ramme: skygge, klem ved trykk, løft ved hover, klipping og hvit kant
function themedButton(x, y, w, h, label, sub, outline, paint, onTap) {
  const r = Math.min(h * 0.32, 22);
  const pr = btnPressAmount(x, y, w, h), hv = hovered(x, y, w, h) ? 1 : 0;
  const sc = 1 - pr * 0.06 + hv * 0.025;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - hv * 2); ctx.scale(sc, sc); ctx.translate(-x - w / 2, -y - h / 2);
  ctx.shadowColor = 'rgba(108,91,123,0.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  roundRect(x, y, w, h, r); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); roundRect(x, y, w, h, r); ctx.clip();
  paint(x, y, w, h);
  // glans øverst
  const gl = ctx.createLinearGradient(0, y, 0, y + h * 0.5);
  gl.addColorStop(0, 'rgba(255,255,255,0.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(x, y, w, h * 0.5);
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fffaf5'; roundRect(x, y, w, h, r); ctx.stroke();
  const hasSub = sub && h > 46;
  const ls = fitSize(label, h * (hasSub ? 0.36 : 0.44), w * 0.62);
  const lx = x + w * 0.06;
  textOutlined(label, lx, y + h * (hasSub ? 0.4 : 0.52), ls, '#ffffff', outline, 'left');
  if (hasSub) textOutlined(sub, lx + 2, y + h * 0.74, Math.max(11, h * 0.2), '#ffffff', outline, 'left', 700);
  ctx.restore();
  buttons.push({ x, y, w, h, onTap, label });
}

function paintSunset(x, y, w, h) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#ffd36e'); g.addColorStop(0.55, '#ffab5e'); g.addColorStop(1, '#f6889a');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  const sx = x + w * 0.82, sy = y + h * 0.78;
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(elapsed * 0.25);
  ctx.fillStyle = 'rgba(255,248,214,0.45)';
  for (let k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-h * 0.12, -h * 1.1); ctx.lineTo(h * 0.12, -h * 1.1); ctx.fill(); }
  ctx.restore();
  const sg = ctx.createRadialGradient(sx, sy, 2, sx, sy, h * 0.55);
  sg.addColorStop(0, '#fffbe2'); sg.addColorStop(0.6, '#ffe58a'); sg.addColorStop(1, 'rgba(255,229,138,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, h * 0.55, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3c2'; ctx.beginPath(); ctx.arc(sx, sy, h * 0.3, 0, 7); ctx.fill();
  // bølgete bakker i silhuett
  ctx.fillStyle = 'rgba(214,110,140,0.55)';
  ctx.beginPath(); ctx.moveTo(x, y + h);
  for (let xx = 0; xx <= w; xx += 6) ctx.lineTo(x + xx, y + h * 0.84 + Math.sin(xx / w * 9 + elapsed * 0.6) * h * 0.06);
  ctx.lineTo(x + w, y + h); ctx.fill();

  drawPomModel(save.look, { inAir: true }); ctx.restore();
}

function paintWiggle(x, y, w, h) {
  // smakebiter av fire verdener i skrå ruter som glir sakte
  const picks = [0, 1, 3, 4, 8, 2];
  const n = 4, pw = w / n, slant = h * 0.35;
  for (let k = -1; k < n + 1; k++) {
    const T = THEMES[picks[(k + 6) % picks.length]];
    const x0 = x + k * pw;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x0 + slant, y); ctx.lineTo(x0 + pw + slant, y); ctx.lineTo(x0 + pw, y + h); ctx.lineTo(x0, y + h); ctx.closePath(); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[2]);
    ctx.fillStyle = g; ctx.fillRect(x0 - 10, y, pw + slant + 20, h);
    ctx.fillStyle = T.hills[1][0];
    ctx.beginPath(); ctx.moveTo(x0 - 10, y + h);
    for (let xx = -10; xx <= pw + slant + 10; xx += 5) ctx.lineTo(x0 + xx, y + h * 0.78 + Math.sin(xx / 40 + k * 2 + elapsed) * h * 0.06);
    ctx.lineTo(x0 + pw + slant + 10, y + h); ctx.fill();
    ctx.translate(x0 + pw * 0.62 + slant * 0.5, y + h * 0.8);
    const s2 = h / 200; ctx.scale(s2, s2); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const icon = { candy: 'cottoncandy', tropic: 'palm', jungle: 'banana', desert: 'cactus', mountain: 'yetirock', city: 'candycane', play: 'ball', sky: 'starlamp', volcano: 'vent', rainbow: 'cheerpom' }[T.id];
    PROP[icon](0.4);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0 + slant, y); ctx.lineTo(x0, y + h); ctx.stroke();
  }
  // mørk tone bak teksten så den blir lesbar
  const tg = ctx.createLinearGradient(x, 0, x + w * 0.7, 0);
  tg.addColorStop(0, 'rgba(160,100,150,0.55)'); tg.addColorStop(1, 'rgba(160,100,150,0)');
  ctx.fillStyle = tg; ctx.fillRect(x, y, w * 0.7, h);
}

function paintHigh(x, y, w, h) {
  const g = ctx.createLinearGradient(x, y + h, x + w * 0.6, y - h * 0.3);
  g.addColorStop(0, '#a9dcfb'); g.addColorStop(0.45, '#6f8fd8'); g.addColorStop(1, '#2b2a6b');

    const sx = x + w * (0.35 + hash(k) * 0.65), sy = y + h * hash(k * 3.3) * 0.7, tw = 0.5 + 0.5 * Math.sin(elapsed * 3 + k);

  }

  // saturn
  ctx.save(); ctx.translate(x + w * 0.86, y + h * 0.36); ctx.rotate(-0.3);

  ctx.beginPath(); ctx.ellipse(0, 0, h * 0.36, h * 0.1, 0, 0, Math.PI); ctx.stroke();

  const t = (elapsed * 0.35) % 1;
  const px = x + w * (0.5 + t * 0.2), py = y + h * (0.95 - t * 0.7);

  ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(px, py); ctx.rotate(-0.9); const ps = h / 170; ctx.scale(ps, ps);
  drawPomModel(save.look, { inAir: true }); ctx.restore();
}

// x, y = føttene; s = størrelse (samme skala som Pom); face = 1 ser mot høyre, -1 mot venstre
let NO_BUDDY = false;   // hjemskjermen tegner buddy selv (den går rundt på egen hånd)
function drawBuddy(id, x, y, s, look = 0, seed = 0, o = {}) {
  const B = BUDDIES[id]; if (!B) return;
  const t = time + seed, X = B.x, has = k => X.includes(k);
  const bob = o.sleep ? 0 : Math.abs(Math.sin(t * 2.6)) * 0.03, blink = o.sleep || o.happy || (t * 0.37 % 1) > 0.965;
  const k = s * 0.95, neck = has('neck') ? 0.32 : 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // skygge
  if (!o.noShadow) { ctx.fillStyle = 'rgba(110,70,130,0.18)'; ctx.beginPath(); ctx.ellipse(0, 0.02 + (o.lift || 0), 0.45 * (o.shadowK || 1), 0.08 * (o.shadowK || 1), 0, 0, 7); ctx.fill(); }
  if (o.lift) ctx.translate(0, -o.lift);
  if (o.rot) { ctx.translate(0, -0.45); ctx.rotate(o.rot); ctx.translate(0, 0.45); }
  if (o.squash) ctx.scale(1 + o.squash, 1 - o.squash);
  if (o.lean) { ctx.translate(0, 0); ctx.rotate(o.lean); }
  const grad = (c1, c2, y1, y2) => { const g = ctx.createLinearGradient(0, y1, 0, y2); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; };
  const body = grad(mix(B.c, '#ffffff', 0.25), B.c, -0.62, 0);
  const edge = () => { ctx.lineWidth = 0.035; ctx.strokeStyle = B.d; ctx.stroke(); };
  // hale og ting bak kroppen
  if (has('thinTail')) { ctx.strokeStyle = B.d; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-0.28, -0.15); ctx.quadraticCurveTo(-0.62, -0.1 + Math.sin(t * 3) * 0.05, -0.55, -0.42); ctx.stroke(); }
  if (has('bushyTail')) { ctx.save(); ctx.translate(-0.3, -0.2); ctx.rotate(-0.6 + Math.sin(t * 3) * 0.12); ctx.fillStyle = B.c; ctx.beginPath(); ctx.ellipse(-0.18, -0.08, 0.26, 0.13, 0, 0, 7); ctx.fill(); edge(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(-0.38, -0.08, 0.08, 0.08, 0, 0, 7); ctx.fill(); ctx.restore(); }
  if (has('curlyTail')) { ctx.strokeStyle = B.d; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.arc(-0.36, -0.22, 0.06, 0, Math.PI * 1.6); ctx.stroke(); }
  if (has('pompomTail')) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-0.33, -0.12, 0.09, 0, 7); ctx.fill(); }
  if (has('dinoTail')) { ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-0.2, -0.05); ctx.quadraticCurveTo(-0.55, -0.05, -0.62, -0.25 + Math.sin(t * 2.5) * 0.04); ctx.quadraticCurveTo(-0.45, -0.18, -0.22, -0.3); ctx.closePath(); ctx.fill(); edge(); }
  if (has('shell')) { ctx.fillStyle = grad('#c9a272', '#9a7448', -0.6, -0.05); ctx.beginPath(); ctx.ellipse(0, -0.3, 0.44, 0.34, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.lineWidth = 0.035; ctx.strokeStyle = '#7d5a34'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,210,0.6)'; ctx.lineWidth = 0.025; for (const [hx, hy] of [[-0.2, -0.42], [0, -0.52], [0.2, -0.42], [0, -0.36]]) { ctx.beginPath(); for (let q = 0; q < 6; q++) { const a = q / 6 * Math.PI * 2; ctx.lineTo(hx + Math.cos(a) * 0.08, hy + Math.sin(a) * 0.07); } ctx.closePath(); ctx.stroke(); } }
  if (has('backSpikes')) { ctx.fillStyle = '#ffb3cf'; for (let q = 0; q < 4; q++) { const a = Math.PI * (1.15 + q * 0.18); ctx.beginPath(); ctx.moveTo(Math.cos(a) * 0.33 - 0.04, -0.3 + Math.sin(a) * 0.3); ctx.lineTo(Math.cos(a) * 0.46, -0.3 + Math.sin(a) * 0.42); ctx.lineTo(Math.cos(a) * 0.33 + 0.05, -0.3 + Math.sin(a) * 0.3); ctx.fill(); } }
  // kropp
  ctx.save(); ctx.translate(0, -bob);
  const pf = clamp(o.poof || 0, 0, 1), fluff = (cx0, cy0, rx, ry, n, sz) => { for (const pass of [0, 1]) { ctx.fillStyle = pass ? mix(B.c, '#ffffff', 0.15) : B.d; for (let q = 0; q < n; q++) { const a = q / n * Math.PI * 2 + Math.sin(t * 2 + q) * 0.06; ctx.beginPath(); ctx.arc(cx0 + Math.cos(a) * rx, cy0 + Math.sin(a) * ry, sz * (0.75 + 0.25 * Math.sin(q * 2.3)) + (pass ? 0 : 0.025), 0, 7); ctx.fill(); } } };
  if (pf > 0.01) fluff(0, -0.3, 0.36 + pf * 0.04, 0.32 + pf * 0.04, 14, 0.04 + 0.1 * pf);   // superfluffy etter vask og føning
  if (has('wool')) { ctx.fillStyle = B.c; for (let q = 0; q < 9; q++) { const a = q / 9 * Math.PI * 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 0.28, -0.3 + Math.sin(a) * 0.24, 0.13, 0, 7); ctx.fill(); } }
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -0.3, 0.34, 0.3, 0, 0, 7); ctx.fill(); edge();
  ctx.fillStyle = has('chest') ? '#fff7e8' : B.belly; ctx.beginPath(); ctx.ellipse(0, -0.24, 0.2, 0.19, 0, 0, 7); ctx.fill();
  if (has('fawnSpots') || has('spots')) { ctx.fillStyle = has('spots') ? B.spot : '#ffffff'; for (const [sx2, sy2, r2] of [[-0.2, -0.42, 0.05], [0.22, -0.36, 0.04], [-0.24, -0.22, 0.035], [0.18, -0.5, 0.03]]) { ctx.beginPath(); ctx.arc(sx2, sy2, r2, 0, 7); ctx.fill(); } }
  if (has('stripes')) { ctx.strokeStyle = B.d; ctx.lineWidth = 0.04; for (const sx2 of [-0.22, 0.22]) { ctx.beginPath(); ctx.moveTo(sx2, -0.48); ctx.lineTo(sx2 * 0.8, -0.38); ctx.stroke(); } }
  // armer / vinger / svømmeføtter
  const armC = has('darkArms') ? '#3b3340' : B.c;
  for (const sg of [-1, 1]) {
    ctx.save(); ctx.translate(sg * 0.3, -0.3); ctx.rotate(sg * (0.5 + Math.sin(t * 3 + sg) * 0.1));
    ctx.fillStyle = armC; ctx.beginPath();
    if (has('wings') || has('flippers')) ctx.ellipse(0, 0.06, 0.07, 0.15, 0, 0, 7); else ctx.ellipse(0, 0.04, 0.065, 0.1, 0, 0, 7);
    ctx.fill(); ctx.restore();
  }
  // føtter
  ctx.fillStyle = has('beak') || has('duckbill') ? '#ffab4a' : has('darkArms') ? '#3b3340' : mix(B.c, B.d, 0.4);
  for (const sg of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sg * 0.16, -0.04, 0.11, 0.065, 0, 0, 7); ctx.fill(); }
  // hode
  ctx.translate(0, -neck);
  if (neck) { ctx.fillStyle = body; rr(-0.1, -0.62, 0.2, neck + 0.12, 0.08); ctx.fill(); ctx.fillStyle = B.spot; ctx.beginPath(); ctx.arc(0.03, -0.45, 0.035, 0, 7); ctx.fill(); }
  ctx.translate(0, Math.sin(t * 1.6) * 0.012 + (o.sleep ? 0.06 : 0)); ctx.rotate(o.sleep ? 0.32 : Math.sin(t * 1.1) * 0.06 + look * 0.05 + (o.shake ? Math.sin(t * 22) * 0.18 : 0));
  const hy = -0.84, hr = 0.4;
  // ører bak hodet
  const earIn = B.earC || mix(B.c, '#ff9cc2', 0.45), earOut = B.earC && ['round'].includes(B.ears) ? B.earC : B.c;
  const ear = (fn) => { for (const sg of [-1, 1]) { ctx.save(); ctx.scale(sg, 1); fn(sg); ctx.restore(); } };
  if (B.ears === 'round') ear(() => { ctx.fillStyle = earOut; ctx.beginPath(); ctx.arc(0.3, hy - 0.3, 0.13, 0, 7); ctx.fill(); ctx.fillStyle = B.earC ? earOut : earIn; ctx.beginPath(); ctx.arc(0.3, hy - 0.3, 0.07, 0, 7); ctx.fill(); });
  if (B.ears === 'mouse') ear(() => { ctx.fillStyle = B.c; ctx.beginPath(); ctx.arc(0.34, hy - 0.28, 0.2, 0, 7); ctx.fill(); edge(); ctx.fillStyle = '#ffc2d4'; ctx.beginPath(); ctx.arc(0.34, hy - 0.28, 0.13, 0, 7); ctx.fill(); });
  if (B.ears === 'pointy' || B.ears === 'bigPointy') ear(() => { const b2 = B.ears === 'bigPointy' ? 1.35 : 1; ctx.fillStyle = B.c; ctx.beginPath(); ctx.moveTo(0.12, hy - 0.3); ctx.lineTo(0.3 * b2, hy - 0.62 * b2 + 0.06); ctx.lineTo(0.38, hy - 0.16); ctx.closePath(); ctx.fill(); edge(); ctx.fillStyle = earIn; ctx.beginPath(); ctx.moveTo(0.18, hy - 0.28); ctx.lineTo(0.29 * b2, hy - 0.52 * b2 + 0.06); ctx.lineTo(0.33, hy - 0.2); ctx.closePath(); ctx.fill(); });
  if (B.ears === 'long') ear(() => { ctx.save(); ctx.translate(0.15, hy - 0.32); ctx.rotate(0.18 + Math.sin(t * 2) * 0.05); ctx.fillStyle = B.c; ctx.beginPath(); ctx.ellipse(0, -0.24, 0.09, 0.3, 0, 0, 7); ctx.fill(); edge(); ctx.fillStyle = '#ffc2d4'; ctx.beginPath(); ctx.ellipse(0, -0.24, 0.045, 0.22, 0, 0, 7); ctx.fill(); ctx.restore(); });
  if (B.ears === 'floppy') ear(() => { ctx.save(); ctx.translate(0.36, hy - 0.08); ctx.rotate(0.7); ctx.fillStyle = earIn; ctx.beginPath(); ctx.ellipse(0, 0.1, 0.07, 0.16, 0, 0, 7); ctx.fill(); ctx.restore(); });
  if (B.ears === 'floppyTri') ear(() => { ctx.fillStyle = B.d; ctx.beginPath(); ctx.moveTo(0.15, hy - 0.32); ctx.lineTo(0.42, hy - 0.42); ctx.lineTo(0.36, hy - 0.16); ctx.closePath(); ctx.fill(); });
  if (B.ears === 'koala') ear(() => { ctx.fillStyle = B.c; ctx.beginPath(); ctx.arc(0.38, hy - 0.18, 0.19, 0, 7); ctx.fill(); edge(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0.39, hy - 0.17, 0.11, 0, 7); ctx.fill(); });
  if (B.ears === 'elephant') ear(() => { ctx.save(); ctx.translate(0.38, hy - 0.02); ctx.rotate(Math.sin(t * 2.2) * 0.12); ctx.fillStyle = B.c; ctx.beginPath(); ctx.ellipse(0.06, 0, 0.2, 0.25, 0.2, 0, 7); ctx.fill(); edge(); ctx.fillStyle = '#ffd1e0'; ctx.beginPath(); ctx.ellipse(0.06, 0, 0.12, 0.17, 0.2, 0, 7); ctx.fill(); ctx.restore(); });
  if (B.ears === 'tiny') ear(() => { ctx.fillStyle = B.d; ctx.beginPath(); ctx.arc(0.25, hy - 0.33, 0.07, 0, 7); ctx.fill(); });
  if (B.ears === 'leaf') ear(() => { ctx.save(); ctx.translate(0.32, hy - 0.22); ctx.rotate(0.9); ctx.fillStyle = B.c; ctx.beginPath(); ctx.ellipse(0, -0.1, 0.07, 0.17, 0, 0, 7); ctx.fill(); ctx.fillStyle = earIn; ctx.beginPath(); ctx.ellipse(0, -0.1, 0.035, 0.11, 0, 0, 7); ctx.fill(); ctx.restore(); });
  if (B.ears === 'tufts') ear(() => { ctx.fillStyle = B.d; ctx.beginPath(); ctx.moveTo(0.16, hy - 0.32); ctx.lineTo(0.34, hy - 0.5); ctx.lineTo(0.34, hy - 0.22); ctx.closePath(); ctx.fill(); });
  if (has('quills')) { ctx.fillStyle = B.d; for (let q = 0; q < 11; q++) { const a = Math.PI * (0.95 + q * 0.11); ctx.beginPath(); ctx.moveTo(Math.cos(a - 0.12) * hr, hy + Math.sin(a - 0.12) * hr); ctx.lineTo(Math.cos(a) * (hr + 0.17), hy + Math.sin(a) * (hr + 0.17)); ctx.lineTo(Math.cos(a + 0.12) * hr, hy + Math.sin(a + 0.12) * hr); ctx.fill(); } }
  if (has('mane')) { for (let q = 0; q < 12; q++) { const a = q / 12 * Math.PI * 2; ctx.fillStyle = q % 2 ? '#e8954a' : '#f2ad5c'; ctx.beginPath(); ctx.arc(Math.cos(a) * (hr + 0.05), hy + Math.sin(a) * (hr + 0.03), 0.12, 0, 7); ctx.fill(); } }
  if (has('rainbowMane')) { ['#ff9cc2', '#ffd36e', '#a8e0c8', '#a9d8ff', '#c9b6f0'].forEach((c2, q) => { ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(-0.3 + q * 0.04, hy - 0.22 + q * 0.12, 0.11, 0, 7); ctx.fill(); }); }
  if (pf > 0.01) fluff(0, hy, hr + pf * 0.05, hr * 0.92 + pf * 0.05, 16, 0.04 + 0.11 * pf);
  // hodet
  ctx.fillStyle = grad(mix(B.c, '#ffffff', 0.3), B.c, hy - hr, hy + hr); ctx.beginPath(); ctx.ellipse(0, hy, hr, hr * 0.92, 0, 0, 7); ctx.fill(); edge();
  if (B.face) { ctx.fillStyle = B.face; ctx.beginPath(); ctx.ellipse(0, hy + 0.1, 0.28, 0.22, 0, 0, 7); ctx.fill(); }
  if (has('patches')) { ctx.fillStyle = '#3b3340'; for (const sg of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sg * 0.16, hy - 0.01, 0.13, 0.16, sg * 0.5, 0, 7); ctx.fill(); } }
  if (has('ossicones')) { for (const sg of [-1, 1]) { ctx.strokeStyle = B.d; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(sg * 0.12, hy - 0.33); ctx.lineTo(sg * 0.15, hy - 0.5); ctx.stroke(); ctx.fillStyle = '#c47a3a'; ctx.beginPath(); ctx.arc(sg * 0.15, hy - 0.52, 0.05, 0, 7); ctx.fill(); } }
  if (has('tuft')) { ctx.strokeStyle = B.d; ctx.lineWidth = 0.04; for (const dx of [-0.04, 0.03, 0.09]) { ctx.beginPath(); ctx.moveTo(dx, hy - 0.36); ctx.quadraticCurveTo(dx + 0.05, hy - 0.5, dx + 0.1, hy - 0.46); ctx.stroke(); } }
  if (has('horn')) { ctx.fillStyle = grad('#fff3a8', '#f2b93a', hy - 0.75, hy - 0.35); ctx.beginPath(); ctx.moveTo(-0.07, hy - 0.34); ctx.lineTo(0.02, hy - 0.72); ctx.lineTo(0.08, hy - 0.34); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.02; ctx.stroke(); if (Math.sin(t * 4) > 0.3) sparkle(0.08, hy - 0.72, 0.07, '#ffffff'); }
  if (has('eyeRings')) { ctx.fillStyle = '#fff7e8'; for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(sg * 0.16, hy - 0.02, 0.16, 0, 7); ctx.fill(); } }

  if (has('frogEyes')) { ctx.fillStyle = B.c; for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(sg * 0.18, ey, 0.15, 0, 7); ctx.fill(); edge(); } }
  for (const sg of [-1, 1]) {
    const ex = sg * 0.16 + look * 0.02;
    if (blink) { ctx.strokeStyle = '#3a2a3f'; ctx.lineWidth = 0.035; ctx.beginPath(); if (o.happy && !o.sleep) ctx.arc(ex, ey + 0.05, 0.08, Math.PI + 0.35, -0.35); else ctx.arc(ex, ey, 0.08, 0.2, Math.PI - 0.2); ctx.stroke(); continue; }

    const EK = B.eyeK || 1; ctx.save(); ctx.translate(ex, ey); ctx.scale(EK, EK); ctx.translate(-ex, -ey);
    ctx.fillStyle = ig; ctx.beginPath(); ctx.ellipse(ex, ey, 0.1, 0.125, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex - 0.035, ey - 0.045, 0.045, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + 0.035, ey + 0.04, 0.02, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,190,240,0.6)'; ctx.beginPath(); ctx.arc(ex + 0.02, ey + 0.065, 0.035, 0, Math.PI); ctx.fill();
    const tw = Math.sin(t * 3.3 + sg * 2);
    if (tw > 0.4) { ctx.globalAlpha *= 1; sparkle(ex + 0.07, ey - 0.09, 0.045 * tw, '#ffffff'); }
    ctx.restore();
  }
  // kinn
  ctx.fillStyle = 'rgba(255,130,170,0.45)'; for (const sg of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sg * 0.27, hy + 0.12, 0.07, 0.045, 0, 0, 7); ctx.fill(); }
  if (has('cheeks')) { ctx.fillStyle = mix(B.c, '#ffffff', 0.5); for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(sg * 0.3, hy + 0.13, 0.13, 0, 7); ctx.fill(); } }
  // nese / nebb / snute og munn

  if (has('beak')) { ctx.fillStyle = '#ffab4a'; ctx.beginPath(); ctx.moveTo(-0.06, my - 0.04); ctx.lineTo(0.06, my - 0.04); ctx.lineTo(0, my + 0.06); ctx.closePath(); ctx.fill(); }
  else if (has('duckbill')) { ctx.fillStyle = '#ffab4a'; ctx.beginPath(); ctx.ellipse(0, my, 0.12, 0.06, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#e28a2c'; ctx.lineWidth = 0.02; ctx.beginPath(); ctx.moveTo(-0.09, my); ctx.lineTo(0.09, my); ctx.stroke(); }

function drawDryer(x, y, S, on, aim) {
  const ang = Math.atan2(aim[1] - y, aim[0] - x), shake = on ? Math.sin(time * 60) * S * 0.015 : 0;
  ctx.save(); ctx.translate(x + shake, y);
  if (on) {   // varm luft
    ctx.save(); ctx.rotate(ang); ctx.lineCap = 'round';
    for (let k = 0; k < 14; k++) { const t = (time * 2.6 + hash(k * 4.1)) % 1, d = S * (0.6 + t * 1.3), off = (hash(k * 2.7) - 0.5) * S * (0.25 + t * 0.6);
      ctx.strokeStyle = `rgba(255,${200 + (k % 3) * 18},${220 - (k % 2) * 30},${0.75 * (1 - t)})`; ctx.lineWidth = Math.max(1.5, S * 0.04);
      ctx.beginPath(); ctx.moveTo(d, off); ctx.quadraticCurveTo(d + S * 0.15, off + Math.sin(time * 20 + k) * S * 0.06, d + S * 0.3, off); ctx.stroke(); }
    for (let k = 0; k < 6; k++) { const t = (time * 1.8 + k / 6) % 1; ctx.globalAlpha = 1 - t; ctx.fillStyle = k % 2 ? '#ffe9c9' : '#ffffff';
      ctx.beginPath(); ctx.arc(S * (1.9 - t * 0.2), (hash(k * 9) - 0.5) * S * 1.2 + Math.sin(t * 9 + k) * S * 0.2 - t * S * 0.4, S * 0.05, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.restore();
  }
  const flip = Math.cos(ang) < 0 ? -1 : 1;
  ctx.rotate(flip < 0 ? ang - Math.PI : ang); ctx.scale(flip, 1);
  ctx.save(); ctx.shadowColor = 'rgba(120,60,100,0.3)'; ctx.shadowBlur = S * 0.2; ctx.shadowOffsetY = S * 0.06;
  // håndtak
  const hg = ctx.createLinearGradient(-S * 0.5, 0, -S * 0.2, 0); hg.addColorStop(0, '#e985ab'); hg.addColorStop(1, '#f7a9c4');
  ctx.fillStyle = hg; ctx.save(); ctx.translate(-S * 0.35, S * 0.15); ctx.rotate(-0.25); rr(-S * 0.13, 0, S * 0.26, S * 0.75, S * 0.12); ctx.fill(); ctx.restore();
  // kropp og munnstykke
  const bg = ctx.createLinearGradient(0, -S * 0.35, 0, S * 0.35); bg.addColorStop(0, '#ffd1e3'); bg.addColorStop(0.5, '#ff9cc2'); bg.addColorStop(1, '#e06d9a');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(-S * 0.35, 0, S * 0.36, S * 0.36, 0, 0, 7); ctx.fill();
  rr(-S * 0.35, -S * 0.2, S * 0.9, S * 0.4, S * 0.08); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#c95a86'; rr(S * 0.5, -S * 0.24, S * 0.14, S * 0.48, S * 0.05); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; rr(-S * 0.55, -S * 0.27, S * 0.9, S * 0.07, S * 0.035); ctx.fill();
  // luftinntak med snurrende vifte
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-S * 0.5, 0, S * 0.17, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e985ab'; ctx.lineWidth = Math.max(1.2, S * 0.035);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + (on ? time * 30 : time); ctx.beginPath(); ctx.moveTo(-S * 0.5, 0); ctx.lineTo(-S * 0.5 + Math.cos(a) * S * 0.13, Math.sin(a) * S * 0.13); ctx.stroke(); }
  ctx.fillStyle = '#ffffff'; heart(-S * 0.05, S * 0.02, S * 0.1); ctx.fill();
  ctx.restore();
}
function drawSpaCursor() {
  if (spaOn() && ['shampoo', 'brush'].includes(STUDIO.tool) && ptr.x >= 0) {
    ctx.save(); ctx.translate(ptr.x + 18, ptr.y - 18); ctx.rotate(Math.sin(time * 8) * (ptr.down ? 0.25 : 0.05));
    spaIcon(STUDIO.tool, 0, 0, 24); ctx.restore();
  }
}

function spaIcon(id, x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (id === 'bath') {
    for (let k = 0; k < 4; k++) { const t = (time * 0.7 + k / 4) % 1; ctx.globalAlpha = 1 - t; ctx.strokeStyle = 'rgba(150,200,255,0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(-r * 0.5 + k * r * 0.35 + Math.sin(t * 6 + k) * r * 0.08, -r * 0.35 - t * r * 0.8, r * (0.08 + k % 2 * 0.05), 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const dyk = Math.sin(time * 3.2) * r * 0.06;
    ctx.fillStyle = '#ffd94a'; ctx.beginPath(); ctx.ellipse(r * 0.45, -r * 0.3 + dyk, r * 0.2, r * 0.12, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(r * 0.56, -r * 0.45 + dyk, r * 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#f39a3a'; ctx.beginPath(); ctx.moveTo(r * 0.64, -r * 0.47 + dyk); ctx.lineTo(r * 0.75, -r * 0.44 + dyk); ctx.lineTo(r * 0.64, -r * 0.41 + dyk); ctx.fill();
    ctx.fillStyle = 'rgba(160,210,255,0.8)'; ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 0.9, r * 0.2, 0, 0, 7); ctx.fill();
    for (let k = 0; k < 5; k++) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-r * 0.6 + k * r * 0.3, -r * 0.25 - (k % 2) * r * 0.15, r * 0.2, 0, 7); ctx.fill(); }
    const g = ctx.createLinearGradient(0, -r * 0.1, 0, r * 0.7); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#f2c6de');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-r, -r * 0.1); ctx.lineTo(r, -r * 0.1); ctx.quadraticCurveTo(r, r * 0.65, r * 0.7, r * 0.65); ctx.lineTo(-r * 0.7, r * 0.65); ctx.quadraticCurveTo(-r, r * 0.65, -r, -r * 0.1); ctx.fill();
    ctx.strokeStyle = '#d99ab8'; ctx.lineWidth = 2; ctx.stroke();
  } else if (id === 'shower') {
    ctx.strokeStyle = '#b6c6da'; ctx.lineWidth = r * 0.16; ctx.beginPath(); ctx.moveTo(r * 0.6, -r * 0.9); ctx.quadraticCurveTo(r * 0.1, -r, 0, -r * 0.45); ctx.stroke();
    ctx.fillStyle = '#dfe8f3'; ctx.beginPath(); ctx.ellipse(0, -r * 0.4, r * 0.55, r * 0.2, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#a9b8cc'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = '#7fc0f0'; ctx.lineWidth = r * 0.09;
    for (let k = -2; k <= 2; k++) { const t = (time * 2 + k * 0.3) % 1; ctx.beginPath(); ctx.moveTo(k * r * 0.2, -r * 0.15 + t * r * 0.7); ctx.lineTo(k * r * 0.22, r * 0.05 + t * r * 0.7); ctx.stroke(); }
  } else if (id === 'shampoo') {
    ctx.rotate(Math.sin(time * 3) * 0.14); ctx.scale(1 + Math.max(0, Math.sin(time * 6)) * 0.06, 1 - Math.max(0, Math.sin(time * 6)) * 0.06);
    for (let k = 0; k < 3; k++) { const t = (time * 0.8 + k / 3) % 1; ctx.globalAlpha = 1 - t; ctx.strokeStyle = 'rgba(200,170,240,0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(-r * 0.15 + Math.sin(t * 7 + k) * r * 0.2, -r * 0.9 - t * r * 0.6, r * (0.08 + k * 0.03), 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const g = ctx.createLinearGradient(-r * 0.4, 0, r * 0.4, 0); g.addColorStop(0, '#f39ac0'); g.addColorStop(0.6, '#ffc6da'); g.addColorStop(1, '#e985ab');
    ctx.fillStyle = g; rr(-r * 0.42, -r * 0.45, r * 0.84, r * 1.15, r * 0.25); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#c993c9'; rr(-r * 0.18, -r * 0.8, r * 0.36, r * 0.38, r * 0.08); ctx.fill();
    ctx.fillStyle = '#ffffff'; heart(0, r * 0.08, r * 0.24); ctx.fill();
    for (const [bx, by, br] of [[r * 0.5, -r * 0.8, r * 0.16], [r * 0.75, -r * 0.55, r * 0.11]]) { ctx.strokeStyle = 'rgba(190,170,240,0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.stroke(); }
  } else if (id === 'brush') {
    ctx.translate(Math.sin(time * 5) * r * 0.15, 0); ctx.rotate(-0.5 + Math.sin(time * 5) * 0.18);
    const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#ffc6da'); g.addColorStop(1, '#e985ab');
    ctx.fillStyle = g; rr(-r * 0.75, -r * 0.42, r * 1.5, r * 0.46, r * 0.2); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#c993c9'; rr(-r * 0.12, -r * 0.02, r * 0.24, r * 0.95, r * 0.1); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.5, r * 0.07);
    for (let k = 0; k < 7; k++) { const xx = -r * 0.62 + k * r * 0.2; ctx.beginPath(); ctx.moveTo(xx, -r * 0.42); ctx.lineTo(xx, -r * 0.7); ctx.stroke(); }
  } else if (id === 'dryer') {
    ctx.rotate(Math.sin(time * 3) * 0.1);
    ctx.strokeStyle = 'rgba(255,170,200,0.9)'; ctx.lineWidth = r * 0.08; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const t = (time * 1.6 + k / 3) % 1; ctx.globalAlpha = 1 - t; ctx.beginPath(); ctx.moveTo(r * (0.55 + t * 0.4), -r * (0.35 - k * 0.2)); ctx.lineTo(r * (0.75 + t * 0.4), -r * (0.35 - k * 0.2)); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#e985ab'; ctx.save(); ctx.translate(-r * 0.25, r * 0.05); ctx.rotate(-0.25); rr(-r * 0.12, 0, r * 0.24, r * 0.7, r * 0.1); ctx.fill(); ctx.restore();
    const g = ctx.createLinearGradient(0, -r * 0.5, 0, r * 0.1); g.addColorStop(0, '#ffd1e3'); g.addColorStop(1, '#f07aa6');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.2, r * 0.32, 0, 7); ctx.fill(); rr(-r * 0.25, -r * 0.38, r * 0.75, r * 0.36, r * 0.08); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-r * 0.36, -r * 0.2, r * 0.13, 0, 7); ctx.fill();
  } else if (id === 'towel') {
    ctx.rotate(-0.2 + Math.sin(time * 2.4) * 0.12); ctx.scale(1, 1 + Math.sin(time * 4.8) * 0.06);
    const g = ctx.createLinearGradient(0, -r * 0.6, 0, r * 0.6); g.addColorStop(0, '#a9d8ff'); g.addColorStop(1, '#7fb6e8');
    ctx.fillStyle = g; rr(-r * 0.85, -r * 0.55, r * 1.7, r * 1.1, r * 0.25); ctx.fill();
    ctx.fillStyle = '#ffffff'; for (const yy of [-0.3, 0.25]) ctx.fillRect(-r * 0.85, yy * r, r * 1.7, r * 0.1);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; rr(-r * 0.85, -r * 0.55, r * 1.7, r * 1.1, r * 0.25); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Scener (bakgrunn bak lyskasteren) ----------
function drawScene(id, x, y, w, h) {
  ctx.save(); ctx.beginPath(); rr(x, y, w, h, Math.min(w, h) * 0.08); ctx.clip();
  const sky = (a, b, c) => { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, a); g.addColorStop(0.6, b); g.addColorStop(1, c); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); };
  const hill = (yy, col, amp, f, ph) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + h); for (let k = 0; k <= 30; k++) { const xx = x + w * k / 30; ctx.lineTo(xx, y + h * yy + Math.sin(k / 30 * Math.PI * f + ph) * h * amp); } ctx.lineTo(x + w, y + h); ctx.fill(); };
  const cloud = (cx, cy, r) => { ctx.fillStyle = 'rgba(255,255,255,0.9)'; for (const [dx, dy, k] of [[-1, 0.2, 0.7], [0, 0, 1], [1, 0.2, 0.75], [0.4, 0.35, 0.7], [-0.5, 0.35, 0.7]]) { ctx.beginPath(); ctx.arc(cx + dx * r, cy + dy * r, r * k, 0, 7); ctx.fill(); } };
  const U = Math.min(w, h);
  if (id === 'candy') {
    sky('#f6bfe0', '#fde2ef', '#fff0e8');
    for (let k = 0; k < 3; k++) cloud(x + w * (0.15 + k * 0.35) + Math.sin(time * 0.3 + k) * w * 0.02, y + h * (0.2 + (k % 2) * 0.12), U * 0.07);
    hill(0.72, '#f7b8d6', 0.04, 3, 1); hill(0.82, '#d8c4f3', 0.03, 4, 2);
    for (let k = 0; k < 4; k++) { const lx = x + w * (0.1 + k * 0.27), ly = y + h * 0.7; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = U * 0.012; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly - U * 0.12); ctx.stroke(); ctx.fillStyle = RAINBOW[k]; ctx.beginPath(); ctx.arc(lx, ly - U * 0.14, U * 0.04, 0, 7); ctx.fill(); }
  } else if (id === 'beach') {
    sky('#8fd3f5', '#c8ecfb', '#eaf8fb');
    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(x + w * 0.8, y + h * 0.2, U * 0.08, 0, 7); ctx.fill();
    ctx.fillStyle = '#6fc8e6'; ctx.fillRect(x, y + h * 0.55, w, h * 0.2);
    for (let k = 0; k < 8; k++) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + ((k * 0.13 + time * 0.03) % 1) * w, y + h * (0.58 + (k % 3) * 0.05), U * 0.05, 2); }
    hill(0.74, '#fbf3df', 0.02, 2, 0);
    ctx.strokeStyle = '#c9a27a'; ctx.lineWidth = U * 0.025; ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.76); ctx.quadraticCurveTo(x + w * 0.12, y + h * 0.5, x + w * 0.2, y + h * 0.36); ctx.stroke();
    ctx.strokeStyle = '#7fcf9a'; ctx.lineWidth = U * 0.022; for (let k = 0; k < 5; k++) { const a = -2.6 + k * 0.55 + Math.sin(time + k) * 0.05; ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + h * 0.36); ctx.quadraticCurveTo(x + w * 0.2 + Math.cos(a) * U * 0.1, y + h * 0.33, x + w * 0.2 + Math.cos(a) * U * 0.16, y + h * 0.36 + Math.abs(Math.sin(a)) * U * 0.05 + U * 0.04); ctx.stroke(); }
  } else if (id === 'jungle') {
    sky('#b6e6c4', '#d8f2d8', '#f2f9dc');
    hill(0.55, '#8fcf9f', 0.06, 5, 0); hill(0.7, '#a7d996', 0.05, 6, 1); hill(0.84, '#86c9b0', 0.03, 7, 2);
    for (let k = 0; k < 5; k++) { const vx = x + w * (0.1 + k * 0.2), sw = Math.sin(time * 1.2 + k) * U * 0.02; ctx.strokeStyle = '#6fb488'; ctx.lineWidth = U * 0.012; ctx.beginPath(); ctx.moveTo(vx, y); ctx.quadraticCurveTo(vx + sw, y + h * 0.2, vx + sw * 1.5, y + h * (0.3 + (k % 2) * 0.1)); ctx.stroke(); ctx.fillStyle = '#9fd8a8'; ctx.beginPath(); ctx.ellipse(vx + sw * 1.5, y + h * (0.3 + (k % 2) * 0.1), U * 0.03, U * 0.015, 0.4, 0, 7); ctx.fill(); }
  } else if (id === 'desert') {
    sky('#ffcfa8', '#ffe9d0', '#fff7e6');
    ctx.fillStyle = '#f4d8a6'; ctx.beginPath(); ctx.moveTo(x + w * 0.45, y + h * 0.72); ctx.lineTo(x + w * 0.65, y + h * 0.35); ctx.lineTo(x + w * 0.85, y + h * 0.72); ctx.fill();
    ctx.fillStyle = '#ddb582'; ctx.beginPath(); ctx.moveTo(x + w * 0.65, y + h * 0.35); ctx.lineTo(x + w * 0.85, y + h * 0.72); ctx.lineTo(x + w * 0.7, y + h * 0.72); ctx.fill();
    hill(0.7, '#f6d9aa', 0.03, 2, 0); hill(0.8, '#f2cf9a', 0.03, 3, 1);
    ctx.fillStyle = '#a8d5a2'; const cx2 = x + w * 0.2, cy2 = y + h * 0.8; rr(cx2 - U * 0.02, cy2 - U * 0.15, U * 0.04, U * 0.15, U * 0.02); ctx.fill(); rr(cx2 - U * 0.06, cy2 - U * 0.1, U * 0.03, U * 0.06, U * 0.015); ctx.fill(); rr(cx2 + U * 0.03, cy2 - U * 0.12, U * 0.03, U * 0.06, U * 0.015); ctx.fill();
  } else if (id === 'snow') {
    sky('#b7cff0', '#e0eafb', '#f6f0fb');
    for (const [mx, mh, c] of [[0.25, 0.45, '#b9b8e0'], [0.6, 0.55, '#a9c3e0'], [0.9, 0.4, '#c6b3d9']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x + w * (mx - 0.3), y + h * 0.8); ctx.lineTo(x + w * mx, y + h * (0.8 - mh)); ctx.lineTo(x + w * (mx + 0.3), y + h * 0.8); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x + w * (mx - 0.08), y + h * (0.8 - mh * 0.72)); ctx.lineTo(x + w * mx, y + h * (0.8 - mh)); ctx.lineTo(x + w * (mx + 0.08), y + h * (0.8 - mh * 0.72)); ctx.fill(); }
    hill(0.8, '#ffffff', 0.02, 3, 0);
    ctx.fillStyle = '#ffffff'; for (let k = 0; k < 30; k++) { const fx = x + ((hash(k) + time * 0.02 * (0.5 + hash(k * 2))) % 1) * w, fy = y + ((hash(k * 3) + time * 0.08 * (0.5 + hash(k * 5))) % 1) * h; ctx.beginPath(); ctx.arc(fx, fy, 1.5 + hash(k * 7) * 2, 0, 7); ctx.fill(); }
  } else if (id === 'city') {
    sky('#e2c6f4', '#f5e2fb', '#ffe8ef');
    for (let k = 0; k < 7; k++) { const bw = w * 0.12, bh = h * (0.25 + hash(k * 3.3) * 0.3), bx = x + w * (0.02 + k * 0.14), by = y + h * 0.82 - bh; ctx.fillStyle = ['#f6c9da', '#c9dcf2', '#f8dcc4', '#cfe8dc', '#e3c6f0'][k % 5]; rr(bx, by, bw, bh + 10, U * 0.02); ctx.fill();
      ctx.fillStyle = '#ffe1ee'; ctx.beginPath(); ctx.ellipse(bx + bw / 2, by, bw * 0.55, U * 0.025, 0, 0, 7); ctx.fill();
      for (let r2 = 0; r2 < 4; r2++) for (let c2 = 0; c2 < 2; c2++) { ctx.fillStyle = `rgba(255,250,222,${0.5 + 0.4 * Math.sin(time + k + r2 + c2)})`; ctx.fillRect(bx + bw * (0.2 + c2 * 0.4), by + U * 0.04 + r2 * U * 0.06, bw * 0.2, U * 0.03); } }
    hill(0.84, '#f7b8d6', 0.01, 2, 0);
  } else if (id === 'playground') {
    sky('#b8defc', '#e3f2ff', '#fff2c4');
    hill(0.8, '#bfe7a5', 0.02, 2, 0);
    ctx.strokeStyle = '#e7a1b5'; ctx.lineWidth = U * 0.015; const sx2 = x + w * 0.25;
    ctx.beginPath(); ctx.moveTo(sx2 - U * 0.12, y + h * 0.82); ctx.lineTo(sx2 - U * 0.08, y + h * 0.45); ctx.lineTo(sx2 + U * 0.08, y + h * 0.45); ctx.lineTo(sx2 + U * 0.12, y + h * 0.82); ctx.stroke();
    const sa = Math.sin(time * 2) * 0.4; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx2, y + h * 0.45); ctx.lineTo(sx2 + Math.sin(sa) * h * 0.25, y + h * 0.45 + Math.cos(sa) * h * 0.25); ctx.stroke();
    ctx.fillStyle = '#a9c8e6'; ctx.fillRect(sx2 + Math.sin(sa) * h * 0.25 - U * 0.03, y + h * 0.45 + Math.cos(sa) * h * 0.25, U * 0.06, U * 0.012);
    for (let k = 0; k < 3; k++) { const bx = x + w * (0.72 + k * 0.07), by = y + h * (0.25 + (k % 2) * 0.06) + Math.sin(time * 1.5 + k) * U * 0.01; ctx.strokeStyle = '#bfaee0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, by + U * 0.04); ctx.lineTo(x + w * 0.78, y + h * 0.6); ctx.stroke(); ctx.fillStyle = RAINBOW[k * 2]; ctx.beginPath(); ctx.ellipse(bx, by, U * 0.03, U * 0.038, 0, 0, 7); ctx.fill(); }
  } else if (id === 'night') {
    sky('#22265e', '#3e3d86', '#7a68b4');
    ctx.save(); ctx.globalAlpha = 0.35; for (const [c, yy] of [['#9ff2c8', 0.2], ['#f2a9d8', 0.28]]) { ctx.strokeStyle = c; ctx.lineWidth = U * 0.06; ctx.beginPath(); for (let k = 0; k <= 20; k++) { const xx = x + w * k / 20; const yv = y + h * yy + Math.sin(k * 0.5 + time * 0.6) * U * 0.03; k ? ctx.lineTo(xx, yv) : ctx.moveTo(xx, yv); } ctx.stroke(); } ctx.restore();
    for (let k = 0; k < 40; k++) { const tw = 0.5 + 0.5 * Math.sin(time * 2 + k); ctx.globalAlpha = tw; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + hash(k) * w, y + hash(k * 3) * h * 0.65, 1 + hash(k * 5) * 1.5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff8e2'; ctx.beginPath(); ctx.arc(x + w * 0.8, y + h * 0.2, U * 0.07, 0, 7); ctx.fill();
    hill(0.82, '#5a4f9a', 0.03, 3, 0);
  } else if (id === 'party') {
    ctx.save(); ctx.translate(x + w / 2, y + h * 0.95); ctx.rotate(time * 0.08);
    for (let k = 0; k < 18; k++) { ctx.fillStyle = RAINBOW[k % 6]; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Math.hypot(w, h), k * Math.PI / 9, (k + 1) * Math.PI / 9); ctx.fill(); }

function healthUpdate(dt) {

      for (let k = 0; k < 8; k++) HOME.fx.push({ k: 'foam', x: G.X + rig.face * G.s * 1.2, y: G.FY - G.s * 1.9, vx: rig.face * (80 + Math.random() * 120), vy: (Math.random() - 0.6) * 90, t: 0, life: 0.7 }); }

    if (M.t > 1.8) { HOME.med = null; if (M.vit) { addNeed('health', 20); BUD.happyT = 1.2; budSay('Me too, please!'); } else cure('cold'); }
  }
  // check-up: hold fingeren på Pom
  if (HOME.act === 'health' && HOME.htool === 'checkup' && ptr.down && inPom(ptr.x, ptr.y) && !HOME.result) {
    HOME.chk = (HOME.chk || 0) + dt; HOME.hint = false;
    HOME.beatT = (HOME.beatT || 0) - dt; if (HOME.beatT < 0) { HOME.beatT = 0.75; FF.heartbeat(); HOME.fx.push({ k: 'heart', x: ptr.x, y: ptr.y - 20, vx: 0, vy: -50, t: 0, life: 0.8 }); }

}

const HEALTHY = ['berries', 'salmon', 'stew', 'kibble'];
function feedResult(id) {   // returnerer gang-faktor for mat og gir helse for variert kosthold

  else if (!last.includes(id) && (new Set(last).size >= 2 || (kind === 'Meal' && HEALTHY.includes(id)))) { addNeed('health', HEALTHY.includes(id) ? 6 : 3); if (Math.random() < 0.5) msg = 'Yummy variety – healthy Pom!'; }

let dtFrame = 0, last = performance.now(), L = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSprites(); L = layout();
}
addEventListener('resize', resize);
resize();
let shown = true;
function frame(now) {
  dtFrame = Math.min(1 / 30, (now - last) / 1000); last = now;
  const want = FF.state() === 'menu';
  if (want !== shown) { shown = want; cv.style.display = want ? 'block' : 'none'; window.FF_overlay = want; if (want) { iris = null; pressedId = null; } }
  if (!shown) { if (FF.state() === 'play') HOME.played = true; requestAnimationFrame(frame); return; }
  if (HOME.played) { HOME.played = false; funGain('game', 30); addNeed('food', -6, true); }      // sparer batteri når spillet vises
  if (Math.abs(wallet - FF.save.wallet) > 0) { wallet = FF.save.wallet; walletBump = 1; }
  time += dtFrame; intro = Math.min(3, intro + dtFrame);

  const tx = ptr.x >= 0 ? (ptr.x / W - 0.5) * 2 : Math.sin(time * 0.25) * 0.4;
  const ty = ptr.y >= 0 ? (ptr.y / H - 0.5) * 2 : Math.cos(time * 0.2) * 0.3;
  par[0] += (tx - par[0]) * Math.min(1, dtFrame * 2); par[1] += (ty - par[1]) * Math.min(1, dtFrame * 2);
  // Pom sovner etter en stund uten berøring
  if (rig.state === 'idle' && time - lastInput > 20 && !toolsOpen && !HOME.act && !HOME.dash) rig.set('sleep');
